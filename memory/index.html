<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
<script src="../assets/config.js"></script>
<link rel="stylesheet" href="../assets/css/giochisat.css">
<script src="../assets/js/giochisat.js"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Memory Match</title>
  <style>
    :root {
      --bg-1: #79bff2;
      --bg-2: #235679;
      --bg-3: #1e2255;
      --ink: #aaccf8;
      --accent: #2188e8;
      --card-back: #1c204f;
      --panel: #1c204f;
      --radius: 18px;
      --shadow: 0 12px 28px rgba(0,0,0,.12)}
    * { box-sizing: border-box}
    body {
      margin: 0;
      min-height: 100vh;
      font-family:var(--gs-testo-font);
      color: var(--ink)}
    button, input { font: inherit}
    .screen { display: none; min-height: 100vh; padding: 24px}
    .screen.active { display: flex}
    .home { align-items: center; justify-content: center; text-align: center}
    .home-card {
      width: min(720px, 100%);
      background: rgba(28,32,79,0.72);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(61,68,143,0.8);
      border-radius: 28px;
      padding: 42px 28px;
      box-shadow: var(--shadow)}
    h1 { margin: 0 0 12px; font-size: clamp(54px, 10vw, 120px); line-height: .88; letter-spacing: -.06em}
    .subtitle { margin: 0 auto 22px; max-width: 560px; font-size: clamp(18px, 2.6vw, 28px); line-height: 1.4}
    .player-box { max-width: 440px; margin: 0 auto 20px; text-align:left}
    .player-box label { display:block; font-weight:800; margin-bottom:7px}
    .player-box input {
      width:100%; border:2px solid rgba(11,63,130,0.16); border-radius:14px;
      padding:13px 15px; background:#1c204f; color:var(--ink); outline:none}
    .player-box input:focus { border-color:var(--accent)}
    .hint { font-size:13px; margin:6px 0 0; opacity:.75}
    .time-options { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-bottom: 22px}
    .time-option, .primary, .secondary {
      border: 0; border-radius: 999px; padding: 12px 22px; cursor: pointer;
      transition: transform .15s ease, filter .15s ease}
    .time-option { background: #1c204f; color: var(--ink); font-weight: 700; min-width: 80px}
    .time-option.selected, .primary { background: var(--accent); color: #ffffff}
    .primary, .secondary { font-weight: 800}
    .secondary { background: transparent; color: var(--accent); border: 3px solid var(--accent)}
    .time-option:hover, .primary:hover, .secondary:hover { transform: translateY(-2px); filter: brightness(1.04)}
    .status { min-height:22px; margin:12px 0 0; font-size:14px; font-weight:700}
    .game { flex-direction: column; gap: 20px}
    .topbar {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
      background: var(--panel); border-radius: 22px; padding: 16px 20px; box-shadow: var(--shadow)}
    .topbar h2 { margin: 0; font-size: clamp(24px, 4vw, 38px)}
    .timer { font-size: clamp(28px, 5vw, 44px); font-weight: 900; color: var(--accent)}
    .actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap}
    .grid-wrap { flex: 1; display: flex; align-items: center; justify-content: center}
    .grid { width: min(1120px, 100%); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px}
    .memory-card {
      position: relative; aspect-ratio: 4 / 3; perspective: 900px; cursor: pointer;
      border-radius: var(--radius); outline: none; display: block; width: 100%; padding: 0;
      border: 0; background: transparent; appearance: none; -webkit-appearance: none}
    .memory-card:focus-visible { box-shadow: 0 0 0 4px rgba(33,136,232,0.42)}
    .card-inner { display:block; width:100%; height:100%; position:relative; transform-style:preserve-3d; transition:transform .35s ease}
    .memory-card.flipped .card-inner, .memory-card.matched .card-inner { transform: rotateY(180deg)}
    .card-face {
      display:block; position:absolute; inset:0; overflow:hidden; border-radius:var(--radius);
      backface-visibility:hidden; -webkit-backface-visibility:hidden; box-shadow:var(--shadow)}
    .card-back {
      display:flex; align-items:center; justify-content:center; background:var(--card-back);
      color:#e4e4e4; font-weight:900; font-size:clamp(28px,5vw,54px);
      border:2px solid rgba(11,63,130,0.08)}
    .card-front { transform:rotateY(180deg); background:#2c327d}
    .card-front img { width:100%; height:100%; object-fit:cover; display:block}
    .memory-card.matched::after {
      content:"✓"; position:absolute; right:10px; top:8px; width:34px; height:34px; border-radius:50%;
      display:grid; place-items:center; background:rgba(28,32,79,0.92); color:var(--ink); font-weight:900; z-index:4}
    .modal {
      position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:22px;
      background:rgba(0,0,0,0.58); z-index:50; overflow:auto}
    .modal.active { display:flex}
    .modal-box {
      width:min(520px,100%); text-align:center; color:#ffffff; background:var(--ink); border-radius:24px;
      padding:30px 24px; box-shadow:var(--shadow)}
    .modal-box h3 { margin:0 0 8px; font-size:40px}
    .modal-actions { display:flex; gap:10px; justify-content:center; margin-top:18px; flex-wrap:wrap}
    .leaderboard { margin:20px 0 0; background:#1c204f; color:var(--ink); border-radius:16px; padding:14px; text-align:left}
    .leaderboard h4 { margin:0 0 9px; font-size:18px}
    .leaderboard ol { margin:0; padding-left:28px}
    .leaderboard li { padding:5px 2px}
    .leaderboard strong { float:right}
    .offline-note { font-size:13px; opacity:.82; margin-top:10px}
    @media (max-width:760px) {
      .screen { padding:14px}
      .home-card { padding:32px 18px}
      .topbar { grid-template-columns:1fr; text-align:center}
      .actions { justify-content:center}
      .grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:11px}
    }
  
/* tema comune */
.modal-box{background:var(--gs-superficie);border:1px solid var(--gs-bordo)}
.leaderboard{background:rgb(9 11 42 / .5);color:var(--gs-testo)}
.livello-info{margin:4px auto 20px;font-weight:600;color:var(--gs-testo-2)}
/* lo schermo di gioco occupa lo spazio sotto le barre comuni */
.screen{min-height:calc(100dvh - var(--gs-alto-barra,68px) - 60px)}
.game{gap:14px}
.grid-wrap{align-items:flex-start}
.grid{width:auto;justify-content:center}
/* carte: rotazione semplice che funziona in tutti i browser (niente 3D) */
.card-inner{transform:none!important;transform-style:flat;transition:none}
.memory-card .card-face{backface-visibility:visible;-webkit-backface-visibility:visible;transform:none!important;transition:opacity 0s linear .14s}
.memory-card .card-front{opacity:0}
.memory-card.flipped .card-front,.memory-card.matched .card-front{opacity:1}
.memory-card.flipped .card-back,.memory-card.matched .card-back{opacity:0}
.memory-card.flipped .card-inner,.memory-card.matched .card-inner{animation:gs-gira-carta .28s ease}
@keyframes gs-gira-carta{0%{transform:scaleX(1)}50%{transform:scaleX(.02)}100%{transform:scaleX(1)}}
.card-back{padding:0;background:var(--gs-superficie)}
.card-back img{width:100%;height:100%;object-fit:cover;display:block}
.memory-card.matched .card-front{box-shadow:0 0 0 4px var(--gs-verde)}
@media (prefers-reduced-motion:reduce){.memory-card .card-inner{animation:none!important}}
</style>
  <script src="../assets/game-stats.js" defer></script>
</head>
<body class="gs" data-gioco="memory" style="--gs-colore:#4F7DFF">
<header class="gs-barra">
  <a class="gs-home" href="../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg><span>Home</span></a>
  <div class="gs-titolo"><i aria-hidden="true"></i><h1>Memory Match</h1></div>
  <button class="gs-nome" type="button" aria-label="Cambia soprannome"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>Soprannome</span></button>
  <img class="gs-logo" src="../assets/logo-arpa-lazio.jpg" alt="ARPA Lazio">
</header>

  <main id="home-screen" class="screen home active">
    <section class="home-card">
      <h1>Memory<br>Match</h1>
      <p class="subtitle">Trova tutte le coppie prima che il tempo finisca.</p>

      <div class="player-box">
        <label for="nickname">Soprannome</label>
        <input id="nickname" maxlength="15" autocomplete="nickname" placeholder="Es. Stella23">
        <p class="hint">Usa un nome di fantasia: comparirà nella classifica pubblica.</p>
      </div>

      <p class="livello-info" id="livello-info"></p>
      <button id="start-btn" class="primary">Inizia il gioco</button>
      <div id="home-status" class="status"></div>
    </section>
  </main>

  <section id="game-screen" class="screen game">
    <header class="topbar">
      <h2 id="player-heading">Memory Match</h2>
      <div id="timer" class="timer">1:00</div>
      <div class="actions">
        <button id="restart-btn" class="primary">Ricomincia</button>
        <button id="home-btn" class="secondary">Menu</button>
      </div>
    </header>
    <div class="grid-wrap"><div id="grid" class="grid" aria-label="Griglia del memory"></div></div>
  </section>

  <div id="result-modal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <h3 id="result-title"></h3>
      <p id="result-text"></p>
      <div id="save-status" class="status"></div>
      <div class="leaderboard">
        <h4 id="leaderboard-title">Classifica — migliori tempi</h4>
        <ol id="leaderboard-list"><li>Caricamento…</li></ol>
      </div>
      <p class="offline-note">La classifica richiede una connessione Internet.</p>
      <div class="modal-actions">
        <button id="play-again-btn" class="primary">Gioca ancora</button>
        <button id="modal-home-btn" class="secondary">Menu</button>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // CONFIGURAZIONE SUPABASE
    // Inserire qui URL del progetto e ANON/PUBLISHABLE KEY.
    // ============================================================
    const SUPABASE_URL = GIOCHISAT_CONFIG.supabaseUrl;
    const SUPABASE_ANON_KEY = GIOCHISAT_CONFIG.supabaseKey;
    const TABLE_NAME = "memory_scores";

    const imageSet = [
      { src: "../immagini/1.jpg", alt: "Immagine 1" },
      { src: "../immagini/2.jpg", alt: "Immagine 2" },
      { src: "../immagini/3.jpg", alt: "Immagine 3" },
      { src: "../immagini/4.jpg", alt: "Immagine 4" },
      { src: "../immagini/5.jpg", alt: "Immagine 5" },
      { src: "../immagini/6.jpg", alt: "Immagine 6" },
      { src: "../immagini/7.jpg", alt: "Immagine 7" },
      { src: "../immagini/8.jpg", alt: "Immagine 8" }
    ];

    let selectedTime = 60;
    let timeRemaining = 60;
    let timerId = null;
    let firstCard = null;
    let secondCard = null;
    let locked = false;
    let matched = 0;
    let moves = 0;
    let startedAt = null;
    let currentNickname = "";

    const homeScreen = document.getElementById("home-screen");
    const gameScreen = document.getElementById("game-screen");
    const grid = document.getElementById("grid");
    const timer = document.getElementById("timer");
    const modal = document.getElementById("result-modal");
    const resultTitle = document.getElementById("result-title");
    const resultText = document.getElementById("result-text");
    const nicknameInput = document.getElementById("nickname");
    const homeStatus = document.getElementById("home-status");
    const saveStatus = document.getElementById("save-status");
    const leaderboardList = document.getElementById("leaderboard-list");
    const leaderboardTitle = document.getElementById("leaderboard-title");
    const playerHeading = document.getElementById("player-heading");

    GiochiSAT.nome.collega(nicknameInput);

    /* Difficoltà: coppie e secondi (vedi "livelli" in assets/config.js) */
    const LIVELLO = GiochiSAT.difficolta.parametri("memory") || { coppie: 8, secondi: 60 };
    selectedTime = LIVELLO.secondi;
    document.getElementById("livello-info").textContent =
      GiochiSAT.difficolta.nome(GiochiSAT.difficolta.di("memory")) + ": " + LIVELLO.coppie + " coppie da trovare in " + LIVELLO.secondi + " secondi";
    /* Retro delle carte: immagine indicata in assets/config.js (memory.retro) */
    const RETRO = GiochiSAT.url((GIOCHISAT_CONFIG.memory && GIOCHISAT_CONFIG.memory.retro) || "assets/memory/retro.svg");


    document.getElementById("start-btn").addEventListener("click", startGame);
    document.getElementById("restart-btn").addEventListener("click", startGame);
    document.getElementById("play-again-btn").addEventListener("click", startGame);
    document.getElementById("home-btn").addEventListener("click", goHome);
    document.getElementById("modal-home-btn").addEventListener("click", goHome);

    function backendConfigured() {
      return SUPABASE_URL.startsWith("https://") &&
             !SUPABASE_URL.includes("INSERISCI_") &&
             !SUPABASE_ANON_KEY.includes("INSERISCI_");
    }

    function cleanNickname(value) {
      return value.trim().replace(/\s+/g, " ").slice(0, 24);
    }

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function showScreen(screen) {
      homeScreen.classList.remove("active");
      gameScreen.classList.remove("active");
      screen.classList.add("active");
    }

    function startGame() {
      if (window.GiochiSATStats) window.GiochiSATStats.recordPlay("memory");
      const nick = GiochiSAT.nome.pulisci(nicknameInput.value);
      const errNick = GiochiSAT.nome.errore(nick);
      if (errNick) {
        homeStatus.textContent = errNick;
        nicknameInput.focus();
        showScreen(homeScreen);
        return;
      }

      currentNickname = nick;
      GiochiSAT.nome.set(nick);
      homeStatus.textContent = "";
      playerHeading.textContent = `Memory Match — ${nick}`;

      clearInterval(timerId);
      modal.classList.remove("active");
      timeRemaining = selectedTime;
      firstCard = null;
      secondCard = null;
      locked = false;
      matched = 0;
      moves = 0;
      startedAt = performance.now();

      buildGrid();
      updateTimer();
      showScreen(gameScreen);
      adattaGriglia();

      timerId = setInterval(() => {
        timeRemaining -= 1;
        updateTimer();
        if (timeRemaining <= 0) endGame(false);
      }, 1000);
    }

    function buildGrid() {
      grid.innerHTML = "";
      const deck = shuffle(shuffle(imageSet).slice(0, LIVELLO.coppie).flatMap((image, pairId) => [
        { ...image, pairId, uid: `${pairId}-a` },
        { ...image, pairId, uid: `${pairId}-b` }
      ]));

      deck.forEach((cardData, index) => {
        const card = document.createElement("button");
        card.className = "memory-card";
        card.type = "button";
        card.dataset.pairId = cardData.pairId;
        card.dataset.uid = cardData.uid;
        card.setAttribute("aria-label", "Carta coperta");
        card.innerHTML = `
          <span class="card-inner">
            <span class="card-face card-back"><img src="${RETRO}" alt=""></span>
            <span class="card-face card-front">
              <img src="${cardData.src}" alt="${cardData.alt}"
                   onerror="this.style.display='none'; this.parentElement.textContent='Immagine non trovata';">
            </span>
          </span>`;
        card.addEventListener("click", () => flipCard(card));
        grid.appendChild(card);
      });
    }

    /* Dimensiona le carte perché stiano tutte nello schermo (formato 4:3). */
    function adattaGriglia() {
      if (!gameScreen.classList.contains("active")) return;
      const n = grid.children.length, gap = window.innerWidth < 760 ? 10 : 14;
      const W = grid.parentElement.clientWidth;
      const H = window.innerHeight - grid.getBoundingClientRect().top - 16;
      let migliore = { lato: 0, colonne: 4 };
      for (let colonne = 2; colonne <= n; colonne++) {
        const righe = Math.ceil(n / colonne);
        const larghezza = Math.min((W - gap * (colonne - 1)) / colonne, ((H - gap * (righe - 1)) / righe) * 4 / 3);
        if (larghezza > migliore.lato) migliore = { lato: larghezza, colonne };
      }
      const lato = Math.max(60, Math.floor(migliore.lato));
      grid.style.gridTemplateColumns = `repeat(${migliore.colonne}, ${lato}px)`;
      grid.style.gap = gap + "px";
      grid.style.width = "auto";
    }
    window.addEventListener("resize", adattaGriglia);

    function flipCard(card) {
      if (locked || card.classList.contains("flipped") || card.classList.contains("matched")) return;
      card.classList.add("flipped");
      card.setAttribute("aria-label", "Carta scoperta");

      if (!firstCard) {
        firstCard = card;
        return;
      }

      secondCard = card;
      locked = true;
      moves += 1;

      if (firstCard.dataset.pairId === secondCard.dataset.pairId) {
        setTimeout(() => {
          firstCard.classList.add("matched");
          secondCard.classList.add("matched");
          matched += 1;
          resetTurn();
          if (matched === LIVELLO.coppie) endGame(true);
        }, 350);
      } else {
        setTimeout(() => {
          firstCard.classList.remove("flipped");
          secondCard.classList.remove("flipped");
          firstCard.setAttribute("aria-label", "Carta coperta");
          secondCard.setAttribute("aria-label", "Carta coperta");
          resetTurn();
        }, 850);
      }
    }

    function resetTurn() {
      firstCard = null;
      secondCard = null;
      locked = false;
    }

    function updateTimer() {
      const minutes = Math.floor(timeRemaining / 60);
      const seconds = String(timeRemaining % 60).padStart(2, "0");
      timer.textContent = `${minutes}:${seconds}`;
    }

    async function endGame(won) {
      clearInterval(timerId);
      locked = true;

      const elapsedMs = startedAt ? Math.round(performance.now() - startedAt) : null;

      resultTitle.textContent = won ? "Hai vinto!" : "Tempo scaduto";
      resultText.textContent = won
        ? `${currentNickname}, hai completato il Memory in ${formatMs(elapsedMs)} con ${moves} tentativi.`
        : `Hai trovato ${matched} coppie su ${LIVELLO.coppie}.`;
      modal.classList.add("active");
      GiochiSAT.fineGioco("memory", { completato: won, punti: won ? elapsedMs : null });

      if (won) {
        await saveScore({
          nickname: currentNickname,
          elapsed_ms: elapsedMs,
          moves: moves,
          time_limit: selectedTime
        });
      } else {
        saveStatus.textContent = "Il risultato entra in classifica solo completando tutte le coppie.";
      }

      await loadLeaderboard();
    }

    function formatMs(ms) {
      if (ms == null) return "—";
      return (ms / 1000).toFixed(2).replace(".", ",") + " s";
    }

    async function saveScore(score) {
      if (!backendConfigured()) {
        saveStatus.textContent = "Classifica non ancora collegata al database.";
        return;
      }

      saveStatus.textContent = "Salvataggio del risultato…";

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE_NAME}`, {
          method: "POST",
          headers: {
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
            "Content-Type": "application/json",
            "Prefer": "return=minimal"
          },
          body: JSON.stringify(score)
        });

        if (!response.ok) throw new Error(await response.text());
        saveStatus.textContent = "Risultato salvato nella classifica.";
      } catch (err) {
        console.error(err);
        saveStatus.textContent = "Non è stato possibile salvare il risultato. Verifica la connessione.";
      }
    }

    async function loadLeaderboard() {
      if (!backendConfigured()) {
        leaderboardList.innerHTML = "<li>Database non ancora configurato.</li>";
        return;
      }

      leaderboardTitle.textContent = `Classifica ${GiochiSAT.difficolta.nome(GiochiSAT.difficolta.di("memory"))} — migliori tempi`;
      leaderboardList.innerHTML = "<li>Caricamento…</li>";

      try {
        const params = new URLSearchParams({
          select: "nickname,elapsed_ms,moves,time_limit",
          time_limit: `eq.${selectedTime}`,
          order: "elapsed_ms.asc",
          limit: "10"
        });

        const response = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE_NAME}?${params.toString()}`, {
          headers: {
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
          }
        });

        if (!response.ok) throw new Error(await response.text());
        const rows = await response.json();

        if (!rows.length) {
          leaderboardList.innerHTML = "<li>Nessun risultato ancora per questa modalità.</li>";
          return;
        }

        // Mantiene solo il miglior risultato per ciascun nickname.
        const bestByNickname = new Map();
        rows.forEach(row => {
          const key = row.nickname.trim().toLowerCase();
          const current = bestByNickname.get(key);
          if (!current ||
              row.elapsed_ms < current.elapsed_ms ||
              (row.elapsed_ms === current.elapsed_ms && row.moves < current.moves)) {
            bestByNickname.set(key, row);
          }
        });

        const bestRows = [...bestByNickname.values()]
          .sort((a, b) => a.elapsed_ms - b.elapsed_ms || a.moves - b.moves)
          .slice(0, 10);

        leaderboardList.innerHTML = "";
        bestRows.forEach(row => {
          const li = document.createElement("li");
          const name = document.createElement("span");
          name.textContent = `${row.nickname} · ${row.moves} tentativi`;
          const time = document.createElement("strong");
          time.textContent = formatMs(row.elapsed_ms);
          li.append(name, time);
          leaderboardList.appendChild(li);
        });
      } catch (err) {
        console.error(err);
        leaderboardList.innerHTML = "<li>Classifica temporaneamente non disponibile.</li>";
      }
    }

    function goHome() {
      clearInterval(timerId);
      modal.classList.remove("active");
      showScreen(homeScreen);
    }
  </script>
</body>
</html>
