<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
<meta name="robots" content="noindex">
<script src="../assets/config.js"></script>
<link rel="stylesheet" href="../assets/css/giochisat.css">
<script src="../assets/js/giochisat.js"></script>

  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Statistiche GiochiSAT</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--blu:#1d4ed8;--blu2:#2f6bff;--testo:#b8ceea;--muted:#bab5d9;--bordo:#3d638f;--bg:#1c4160}
    *{box-sizing:border-box}body{margin:0;font-family:var(--gs-testo-font);color:var(--testo);min-height:100vh}
    .wrap{max-width:1100px;margin:auto;padding:22px 16px 50px}.brand{display:flex;gap:14px;align-items:center;margin-bottom:20px}.brand img{width:72px;border-radius:10px}.brand h1{margin:0;color:var(--blu);font-size:clamp(27px,5vw,42px)}
    .card{background:#1c204f;border:1.5px solid var(--bordo);border-radius:22px;padding:20px;box-shadow:0 12px 30px rgba(39,77,120,0.1);margin-bottom:18px}.login{display:flex;gap:10px}.login input{flex:1;border:2px solid var(--bordo);border-radius:14px;padding:13px;font-size:17px}.btn{border:0;border-radius:14px;padding:13px 18px;background:var(--blu2);color:#ffffff;font-weight:800;font-size:16px;cursor:pointer}.hidden{display:none!important}.msg{margin-top:12px;color:#f1b1b1;font-weight:700}
    .periods{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}.periods button{border:2px solid var(--bordo);background:#1c204f;color:var(--blu);border-radius:12px;padding:9px 14px;font-weight:800;cursor:pointer}.periods button.on{background:var(--blu);color:#ffffff;border-color:var(--blu)}
    .summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.stat{background:#1e2255;border:1.5px solid var(--bordo);border-radius:16px;padding:15px}.stat b{display:block;font-size:28px;color:var(--blu)}.stat span{font-size:13px;font-weight:700;color:var(--muted)}
    h2{color:var(--blu);margin:4px 0 14px}.tableWrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{padding:10px 12px;border-bottom:1px solid var(--bordo);text-align:right}th:first-child,td:first-child{text-align:left}th{color:var(--blu);background:#1e2255}.note{color:var(--muted);line-height:1.5;font-size:14px}
    @media(max-width:650px){.login{flex-direction:column}.summary{grid-template-columns:1fr 1fr}.brand img{width:58px}}
  </style>
</head>
<body class="gs" data-gioco="statistiche" style="--gs-colore:#5CC8FF">
<header class="gs-barra">
  <a class="gs-home" href="../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg><span>Home</span></a>
  <div class="gs-titolo"><i aria-hidden="true"></i><h1>Statistiche</h1></div>
  
  <img class="gs-logo" src="../assets/logo-arpa-lazio.jpg" alt="ARPA Lazio">
</header>

<main class="wrap">
  <section id="login" class="card">
    <h2>Accesso riservato</h2>
    <div class="login"><input id="pwd" type="password" placeholder="Password della regia"><button class="btn" id="load">Visualizza</button></div>
    <div id="error" class="msg"></div>
  </section>
  <section id="dashboard" class="hidden">
    <div class="card">
      <div class="periods"><button data-period="day" class="on">Giornalieri</button><button data-period="month">Mensili</button><button data-period="all">Totali storici</button><button id="refresh">Aggiorna</button></div>
      <h2 id="title">Giocatori giornalieri</h2><div id="summary" class="summary"></div>
    </div>
    <div class="card tableWrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
    <p class="note">I valori rappresentano browser o dispositivi anonimi che hanno iniziato un gioco. Non identificano persone fisiche e decorrono dall'attivazione del sistema.</p>
  </section>
</main>
<script>
const SUPABASE_URL=GIOCHISAT_CONFIG.supabaseUrl;
const SUPABASE_KEY=GIOCHISAT_CONFIG.supabaseKey;
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const games=['totale','memory','missione-satellite','quiz-terra','sensore-adatto','puzzle-satelliti','quizzone','sat-doku','parole-in-orbita','duello-orbitale'];
const labels={'totale':'Totale GiochiSAT','memory':'Memory Match','missione-satellite':'Missione satellite','quiz-terra':'Quiz Terra','sensore-adatto':'Sensore adatto','puzzle-satelliti':'Puzzle satelliti','quizzone':'Quizzone Live','sat-doku':'SAT-Doku','parole-in-orbita':'Parole in orbita','duello-orbitale':'Duello orbitale'};
let rows=[],period='day'; const $=id=>document.getElementById(id);

async function load(){
  $('error').textContent='';
  const {data,error}=await sb.rpc('game_admin_stats',{p_password:$('pwd').value});
  if(error){$('error').textContent='Password non valida o statistiche non ancora configurate.';return;}
  rows=data||[];$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');render();
}
function render(){
  document.querySelectorAll('[data-period]').forEach(b=>b.classList.toggle('on',b.dataset.period===period));
  const filtered=rows.filter(r=>r.period_type===period);
  const periods=[...new Set(filtered.map(r=>r.period_key))].sort().reverse();
  $('title').textContent=period==='day'?'Giocatori giornalieri':period==='month'?'Giocatori mensili':'Totali storici';
  const current=periods[0]||'';
  const currentRows=filtered.filter(r=>r.period_key===current);
  $('summary').innerHTML=games.map(g=>{const r=currentRows.find(x=>x.game_id===g);return `<div class="stat"><b>${r?r.player_count:0}</b><span>${labels[g]}</span></div>`}).join('');
  $('thead').innerHTML='<tr><th>Periodo</th>'+games.map(g=>`<th>${labels[g]}</th>`).join('')+'</tr>';
  $('tbody').innerHTML=periods.map(p=>'<tr><td>'+p+'</td>'+games.map(g=>{const r=filtered.find(x=>x.period_key===p&&x.game_id===g);return `<td>${r?r.player_count:0}</td>`}).join('')+'</tr>').join('')||`<tr><td colspan="${games.length+1}">Nessun dato disponibile</td></tr>`;
}
document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{period=b.dataset.period;render();});
$('load').onclick=load;$('pwd').onkeydown=e=>{if(e.key==='Enter')load();};
$('refresh').onclick=load;
</script>
</body>
</html>
