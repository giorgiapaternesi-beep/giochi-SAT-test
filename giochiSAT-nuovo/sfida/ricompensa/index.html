<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ricompensa – Giochi SAT</title>
  <meta name="description" content="Ricompensa della sfida">
  <meta name="theme-color" content="#090B2A">
  <link rel="icon" href="../../assets/logo-arpa-lazio.jpg">
  <link rel="stylesheet" href="../../assets/css/giochisat.css">
  <script src="../../assets/config.js"></script>
  <script src="../../assets/js/giochisat.js"></script>
  <style>
.intro{margin:4px 0 18px}.intro h2{margin:0 0 6px;font-size:clamp(24px,4vw,30px)}.intro p{margin:0;color:var(--gs-testo-2)}
.piede{margin-top:22px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center}

.premio{text-align:center;padding:30px 24px}
.medaglia{width:140px;height:140px;display:block;margin:0 auto 10px}
.premio h2{margin:0 0 8px;font-size:clamp(26px,5vw,34px)}.premio p{margin:0 auto;max-width:42ch;color:var(--gs-testo-2)}
</style>
</head>
<body class="gs" style="--gs-colore:#FFC93C">
<header class="gs-barra">
  <a class="gs-home" href="../../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg><span>Home</span></a>
  <div class="gs-titolo"><i aria-hidden="true"></i><h1>Ricompensa</h1></div>
  <button class="gs-nome" type="button" aria-label="Cambia soprannome"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>Soprannome</span></button>
  <img class="gs-logo" src="../../assets/logo-arpa-lazio.jpg" alt="ARPA Lazio">
</header>
<script src="ricompensa.js"></script>
<main class="gs-pagina">

  <section class="gs-scheda premio" id="premio">
    <svg class="medaglia" viewBox="-60 -60 120 120" aria-hidden="true">
      <path d="M-22-58h18l12 34h-18zM22-58H4l-12 34h18z" fill="#FF5C8A"/>
      <circle r="38" cy="14" fill="#FFC93C"/><circle r="29" cy="14" fill="#FFB238"/>
      <path d="M0-4c1.3 8.6 4.8 12 14 13.6-9.2 1.6-12.7 5-14 13.6-1.3-8.6-4.8-12-14-13.6C-4.8 8-1.3 4.6 0-4Z" fill="#FFF6D8"/>
    </svg>
    <h2 id="titolo">Ricompensa in arrivo</h2>
    <p id="testo">Qui comparirà la ricompensa per chi completa la sfida. La stiamo ancora preparando!</p>
    <div id="contenuto-ricompensa"></div>
  </section>
  <div class="piede"><a class="gs-btn gs-secondario" href="../../">Torna alla home</a></div>
</main>
<script>

(function () {
  var s = GiochiSAT.sfida.stato();
  if (!s || s.stato !== "vinta") {
    document.getElementById("titolo").textContent = "Nessuna ricompensa, per ora";
    document.getElementById("testo").textContent = "La ricompensa si ottiene completando tutti i giochi di una sfida entro il tempo.";
    return;
  }
  /* Punto di aggancio: ricompensa.js (in questa cartella) definisce
     GiochiSATRicompensa.mostra(esito, contenitore). Vedi assets/ricompense/LEGGIMI.md */
  if (window.GiochiSATRicompensa && typeof GiochiSATRicompensa.mostra === "function") {
    GiochiSATRicompensa.mostra(s, document.getElementById("contenuto-ricompensa"));
  }
})();
</script>
</body>
</html>
