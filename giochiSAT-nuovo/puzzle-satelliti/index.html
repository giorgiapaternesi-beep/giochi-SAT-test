<style>
:root{--blu:#2f6bff;--blu-scuro:#b1c0f2;--verde:#22c55e;--verde-scuro:#b0f2c9;--giallo:#facc15;
  --cielo1:#1f426b;--cielo2:#1f2458;--testo:#e8e5f5;--grigio:#bab5d9;--card:#1c204f;--bordo:#3d5f8f}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:var(--gs-testo-font);color:var(--testo);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:22px 18px 60px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.top svg{width:46px;height:46px;flex:0 0 auto}
.top h1{font-family:var(--gs-titoli-font);font-weight:700;font-size:22px;margin:0;line-height:1}
.top p{margin:3px 0 0;color:var(--grigio);font-weight:700;font-size:13px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.count{font-family:var(--gs-titoli-font);font-weight:600;font-size:16px;color:var(--grigio)}
.count b{color:var(--verde-scuro)}
.tools{display:flex;gap:8px}
.tool{font-family:var(--gs-titoli-font);font-weight:600;font-size:14px;border:2px solid var(--bordo);background:#1c204f;color:var(--testo);
  border-radius:12px;padding:9px 14px;cursor:pointer;transition:.12s}
.tool:hover{border-color:var(--blu);color:var(--blu-scuro)}
.tool:active{transform:translateY(1px)}
.board{background:linear-gradient(180deg,#0e1836,#141f4a);border:2px solid #3d4b8f;border-radius:22px;padding:8px;
  box-shadow:0 18px 40px rgba(11,18,40,0.4);position:relative;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.board svg{width:100%;height:auto;display:block;touch-action:none;-webkit-user-select:none;user-select:none}
.slot{fill:none;stroke:rgba(190,214,255,0.28);stroke-width:1.4;stroke-dasharray:4 6}
.pc{cursor:grab;touch-action:none}
.pc.locked{cursor:default}
.pc .edge{fill:none;stroke:rgba(255,255,255,0.6);stroke-width:1.2}
.pc.drag{cursor:grabbing}
.win{position:absolute;inset:8px;border-radius:16px;display:none;place-items:center;text-align:center;
  background:rgba(9,14,34,0.55);backdrop-filter:blur(2px)}
.win.show{display:grid;animation:fadein .4s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.win .box{background:#1c204f;border-radius:20px;padding:22px 26px;box-shadow:0 20px 50px rgba(0,0,0,0.4);max-width:80%}
.win h2{font-family:var(--gs-titoli-font);font-weight:700;font-size:24px;margin:0 0 6px}
.win p{color:var(--grigio);font-weight:700;margin:0 0 12px;font-size:15px}
.win .wintime{font-family:var(--gs-titoli-font);font-weight:700;font-size:17px;color:var(--blu-scuro);margin:0 0 16px}
.btn{font-family:var(--gs-titoli-font);font-weight:600;font-size:17px;border:none;cursor:pointer;border-radius:14px;padding:13px 22px;color:#ffffff;
  background:var(--blu);box-shadow:0 6px 0 #1f4fd6;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #1f4fd6}
.hint{margin-top:12px;color:var(--grigio);font-weight:700;font-size:13px;text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:10px;height:14px;border-radius:2px;opacity:.95;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
<script src="../assets/game-stats.js" defer></script>

<script>
const NX=4, NY=4;
const BX=40, BY=24, IW=480, IH=384;
const W=NX*(IW/NX); // = IW
const w=IW/NX, h=IH/NY;
const board=document.getElementById("board");
const svgNS="http://www.w3.org/2000/svg";
let H=[], V=[], pieces=[], locked=0;
let tStart=null, tId=null, best=null;
function fmt(ms){ const s=Math.floor(ms/1000), m=(s/60)|0, ss=s%60; return String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0"); }
function tick(){ if(tStart) document.getElementById("time").textContent=fmt(Date.now()-tStart); }
function startTimer(){ if(tStart) return; tStart=Date.now(); tId=setInterval(tick,250); }
function stopTimer(){ if(tId){clearInterval(tId);tId=null;} return tStart?Date.now()-tStart:0; }
function resetTimer(){ if(tId){clearInterval(tId);tId=null;} tStart=null; document.getElementById("time").textContent="00:00"; }

function rnd(){ return Math.random()<0.5?-1:1; }
function hFwd(ax,ay,L,s){ if(!s) return `L ${ax+L} ${ay}`; const r=0.15*L,n=0.5*L-r,cx=ax+0.5*L,b=ay+s*2*r;
  return `L ${ax+n} ${ay} C ${ax+n} ${ay+s*0.8*r} ${cx-r} ${b} ${cx} ${b} C ${cx+r} ${b} ${ax+L-n} ${ay+s*0.8*r} ${ax+L-n} ${ay} L ${ax+L} ${ay}`; }
function hRev(ax,ay,L,s){ if(!s) return `L ${ax} ${ay}`; const r=0.15*L,n=0.5*L-r,cx=ax+0.5*L,b=ay+s*2*r;
  return `L ${ax+L-n} ${ay} C ${ax+L-n} ${ay+s*0.8*r} ${cx+r} ${b} ${cx} ${b} C ${cx-r} ${b} ${ax+n} ${ay+s*0.8*r} ${ax+n} ${ay} L ${ax} ${ay}`; }
function vFwd(ax,ay,L,s){ if(!s) return `L ${ax} ${ay+L}`; const r=0.15*L,n=0.5*L-r,cy=ay+0.5*L,b=ax+s*2*r;
  return `L ${ax} ${ay+n} C ${ax+s*0.8*r} ${ay+n} ${b} ${cy-r} ${b} ${cy} C ${b} ${cy+r} ${ax+s*0.8*r} ${ay+L-n} ${ax} ${ay+L-n} L ${ax} ${ay+L}`; }
function vRev(ax,ay,L,s){ if(!s) return `L ${ax} ${ay}`; const r=0.15*L,n=0.5*L-r,cy=ay+0.5*L,b=ax+s*2*r;
  return `L ${ax} ${ay+L-n} C ${ax+s*0.8*r} ${ay+L-n} ${b} ${cy+r} ${b} ${cy} C ${b} ${cy-r} ${ax+s*0.8*r} ${ay+n} ${ax} ${ay+n} L ${ax} ${ay}`; }

function piecePath(i,j){
  const ox=BX+i*w, oy=BY+j*h;
  let d=`M ${ox} ${oy} `;
  d += (j>0)?      hFwd(ox,oy,w, H[i][j])        : `L ${ox+w} ${oy}`;
  d += (i<NX-1)?   vFwd(ox+w,oy,h, V[i+1][j])    : `L ${ox+w} ${oy+h}`;
  d += (j<NY-1)?   hRev(ox,oy+h,w, H[i][j+1])    : `L ${ox} ${oy+h}`;
  d += (i>0)?      vRev(ox,oy,h, V[i][j])        : `L ${ox} ${oy}`;
  return d+" Z";
}

function svgPoint(e){
  const ctm=board.getScreenCTM();
  if(!ctm) return null;
  const p=board.createSVGPoint();
  p.x=e.clientX;
  p.y=e.clientY;
  return p.matrixTransform(ctm.inverse());
}

function costruisci(){
  H=[]; V=[];
  for(let i=0;i<NX;i++){ H[i]=[]; V[i]=[]; for(let j=0;j<NY;j++){ H[i][j]=rnd(); V[i][j]=rnd(); } }
  const sl=document.getElementById("slots"); sl.innerHTML="";
  for(let i=0;i<NX;i++)for(let j=0;j<NY;j++){
    const r=document.createElementNS(svgNS,"rect");
    r.setAttribute("x",BX+i*w); r.setAttribute("y",BY+j*h); r.setAttribute("width",w); r.setAttribute("height",h);
    r.setAttribute("class","slot"); sl.appendChild(r);
  }
  const clips=document.getElementById("clips"); clips.innerHTML="";
  const layer=document.getElementById("pieces"); layer.innerHTML="";
  pieces=[]; locked=0; updateCount();
  for(let i=0;i<NX;i++)for(let j=0;j<NY;j++){
    const d=piecePath(i,j), id="cp"+i+"_"+j;
    const cp=document.createElementNS(svgNS,"clipPath"); cp.setAttribute("id",id);
    const pth=document.createElementNS(svgNS,"path"); pth.setAttribute("d",d); cp.appendChild(pth); clips.appendChild(cp);
    const g=document.createElementNS(svgNS,"g"); g.setAttribute("class","pc");
    g.setAttribute("clip-path","url(#"+id+")"); g.setAttribute("filter","url(#psh)");
    const use=document.createElementNS(svgNS,"use"); use.setAttribute("href","#scene"); use.setAttribute("x",BX); use.setAttribute("y",BY);
    const edge=document.createElementNS(svgNS,"path"); edge.setAttribute("d",d); edge.setAttribute("class","edge");
    g.appendChild(use); g.appendChild(edge);
    const cxHome=BX+i*w+w/2, cyHome=BY+j*h+h/2;
    const p={g,i,j,cxHome,cyHome,tx:0,ty:0,locked:false};
    setPos(p,0,0);
    g.addEventListener("pointerdown", e=>onDown(e,p));
    layer.appendChild(g); pieces.push(p);
  }
  updateCount();
  scatter();
}

function setPos(p,tx,ty){ p.tx=tx; p.ty=ty; p.g.setAttribute("transform",`translate(${tx.toFixed(1)},${ty.toFixed(1)})`); }

function scatter(){
  const order=[...pieces.keys()]; for(let i=order.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[order[i],order[j]]=[order[j],order[i]];}
  const cols=NX, rows=Math.ceil(pieces.length/cols);
  const tx0=40, ty0=452, cw=(500-40)/cols, ch=360/rows;
  order.forEach((pi,k)=>{
    const p=pieces[pi]; if(p.locked) return;
    const c=k%cols, r=(k/cols)|0;
    const tgx=tx0 + c*cw + cw/2 + (Math.random()-.5)*18;
    const tgy=ty0 + r*ch + ch/2 + (Math.random()-.5)*14;
    setPos(p, tgx-p.cxHome, tgy-p.cyHome);
    p.g.parentNode.appendChild(p.g);
  });
}

let cur=null, off={x:0,y:0};
let activePointerId=null;
let pendingPointerEvent=null;
let dragFrame=null;

function applyPendingDrag(){
  dragFrame=null;
  if(!cur || !pendingPointerEvent) return;
  const e=pendingPointerEvent;
  pendingPointerEvent=null;
  const q=svgPoint(e);
  if(!q) return;
  setPos(cur, q.x-off.x, q.y-off.y);
}

function onDown(e,p){
  if(window.GiochiSATStats) window.GiochiSATStats.recordPlay("puzzle-satelliti");
  if(p.locked) return;
  if(cur!==null) return;
  if(e.isPrimary===false) return;

  startTimer();
  const q=svgPoint(e);
  if(!q) return;

  cur=p;
  activePointerId=e.pointerId;
  pendingPointerEvent=null;

  p.g.classList.add("drag");
  p.g.parentNode.appendChild(p.g);

  // Riduce il carico grafico durante il trascinamento.
  p.g.setAttribute("filter","none");

  try{ board.setPointerCapture(e.pointerId); }catch(_){}

  off.x=q.x-p.tx;
  off.y=q.y-p.ty;
  e.preventDefault();
}

board.addEventListener("pointermove", e=>{
  if(!cur) return;
  if(e.pointerId!==activePointerId) return;

  pendingPointerEvent=e;

  if(dragFrame===null){
    dragFrame=requestAnimationFrame(applyPendingDrag);
  }

  e.preventDefault();
},{passive:false});

function finishDrag(e,allowSnap=true){
  if(!cur) return;
  if(e && activePointerId!==null && e.pointerId!==activePointerId) return;

  if(dragFrame!==null){
    cancelAnimationFrame(dragFrame);
    dragFrame=null;
  }

  if(pendingPointerEvent){
    const q=svgPoint(pendingPointerEvent);
    if(q) setPos(cur, q.x-off.x, q.y-off.y);
    pendingPointerEvent=null;
  }

  const p=cur;
  cur=null;

  p.g.classList.remove("drag");
  p.g.setAttribute("filter","url(#psh)");

  if(e && activePointerId!==null){
    try{
      if(board.hasPointerCapture && board.hasPointerCapture(activePointerId)){
        board.releasePointerCapture(activePointerId);
      }
    }catch(_){}
  }

  activePointerId=null;

  if(!allowSnap) return;

  const tol=0.34*Math.min(w,h);
  if(Math.hypot(p.tx,p.ty)<tol){
    setPos(p,0,0);
    p.locked=true;
    p.g.classList.add("locked");
    const layer=document.getElementById("pieces");
    layer.insertBefore(p.g,layer.firstChild);
    locked++;
    updateCount();
    pulse(p);
    if(locked===pieces.length) vinci();
  }
}

function onUp(e){ finishDrag(e,true); }
function onCancel(e){ finishDrag(e,false); }

board.addEventListener("pointerup",onUp);
board.addEventListener("pointercancel",onCancel);
board.addEventListener("lostpointercapture",e=>{
  if(cur && e.pointerId===activePointerId){
    finishDrag(e,false);
  }
});

function pulse(p){ const e=p.g.querySelector(".edge"); e.style.transition="none"; e.setAttribute("stroke","#6ee7b7"); e.setAttribute("stroke-width","2.4");
  setTimeout(()=>{ e.setAttribute("stroke","rgba(255,255,255,.6)"); e.setAttribute("stroke-width","1.2"); }, 500); }
function updateCount(){ document.getElementById("count").textContent=locked; document.getElementById("total").textContent=pieces.length; }

function vinci(){
  const el=stopTimer(); const t=fmt(el);
  let msg="Completato in "+t;
  if(best===null || el<best){ best=el; msg+=" — nuovo record!"; } else { msg+=" — record "+fmt(best); }
  document.getElementById("wintime").textContent=msg;
  document.querySelectorAll(".pc .edge").forEach(e=>e.setAttribute("stroke","rgba(255,255,255,0)"));
  document.getElementById("slots").style.display="none";
  setTimeout(()=>{ document.getElementById("win").classList.add("show"); coriandoli(); }, 350);
  GiochiSAT.fineGioco("puzzle-satelliti", { punti: el });
}
function coriandoli(){ const box=document.getElementById("confetti"); box.innerHTML=""; const col=["#2f6bff","#22c55e","#facc15","#fb7185","#38bdf8"];
  for(let k=0;k<100;k++){ const c=document.createElement("i"); c.style.left=Math.random()*100+"vw"; c.style.background=col[k%col.length];
    c.style.animationDuration=(2.4+Math.random()*1.8)+"s"; c.style.animationDelay=(Math.random()*.5)+"s"; c.style.transform="rotate("+(Math.random()*360)+"deg)"; box.appendChild(c);}
  setTimeout(()=>box.innerHTML="",5000); }

document.getElementById("shuffle").addEventListener("click",()=>{
  document.getElementById("slots").style.display=""; pieces.forEach(p=>{ p.locked=false; p.g.classList.remove("locked"); });
  locked=0; updateCount(); resetTimer(); scatter(); });
document.getElementById("again").addEventListener("click",()=>{ document.getElementById("win").classList.remove("show");
  document.getElementById("slots").style.display=""; resetTimer(); costruisci(); });

board.addEventListener("contextmenu",e=>e.preventDefault());
board.addEventListener("dragstart",e=>e.preventDefault());

costruisci();
</script>
</body>
