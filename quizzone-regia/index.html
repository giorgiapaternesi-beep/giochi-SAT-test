<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8">
<meta name="robots" content="noindex">
<script src="../assets/config.js"></script>
<link rel="stylesheet" href="../assets/css/giochisat.css">
<script src="../assets/js/giochisat.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Quizzone Live - Regia</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blu:#1d4ed8;--rosso:#dc2626;--testo:#b8ceea;--muted:#bab5d9;--bordo:#3d638f;--cielo:#1d4463}*{box-sizing:border-box}body{margin:0;font-family:var(--gs-testo-font);color:var(--testo);min-height:100vh}.wrap{max-width:920px;margin:auto;padding:22px 18px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}.brand img{width:60px;height:60px;object-fit:contain;background:#1c204f;border-radius:10px}.brand h1{font:700 28px var(--gs-titoli-font);margin:0}.brand p{margin:2px 0 0;font-weight:800;color:var(--muted)}.card{background:#1c204f;border:1.5px solid var(--bordo);border-radius:24px;padding:22px;box-shadow:0 14px 35px rgba(39,77,120,0.1);margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.status{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.s{background:#1e2255;border:1.5px solid var(--bordo);border-radius:16px;padding:14px;text-align:center}.s b{display:block;font:700 25px var(--gs-titoli-font);color:var(--blu)}.s span{font-weight:800;color:var(--muted);font-size:13px}.password{display:flex;gap:10px}.password input,.settings select{flex:1;border:2px solid var(--bordo);border-radius:14px;padding:12px;font:700 16px var(--gs-testo-font);background:#1c204f}.settings{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.field{display:grid;gap:6px}.field label{font-weight:800;color:var(--muted);font-size:13px}.btn{border:0;border-radius:16px;padding:15px 18px;font:700 17px var(--gs-titoli-font);cursor:pointer;background:var(--blu);color:#ffffff}.btn.red{background:var(--rosso)}.btn.gray{background:#64748b}.btn:disabled{opacity:.45;cursor:not-allowed}.msg{padding:12px 14px;border-radius:14px;background:#1c3b5f;color:#b1c0f2;font-weight:800;margin-top:12px}.warn{background:#60411c;color:#f5bfad}.danger{background:#1f2459;color:#f1b1b1}.q{font:700 24px var(--gs-titoli-font);margin:0 0 8px}.muted{color:var(--muted);font-weight:700}.links a{display:block;margin:6px 0;color:var(--blu);font-weight:800;word-break:break-all}@media(max-width:700px){.grid,.status,.settings{grid-template-columns:1fr 1fr}.password{flex-direction:column}}@media(max-width:420px){.status,.settings{grid-template-columns:1fr}}
</style></head><body class="gs" data-gioco="quizzone-regia" style="--gs-colore:#9B7BFF">
<header class="gs-barra">
  <a class="gs-home" href="../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg><span>Home</span></a>
  <div class="gs-titolo"><i aria-hidden="true"></i><h1>Regia del Quizzone</h1></div>
  
  <img class="gs-logo" src="../assets/logo-arpa-lazio.jpg" alt="ARPA Lazio">
</header>
<div class="wrap">

<div class="card"><div class="password"><input id="pwd" type="password" placeholder="Password della regia" autocomplete="current-password"><button class="btn gray" id="toggle">Mostra</button></div><div class="msg">La password resta nel browser e non è scritta nel codice della pagina.</div></div>
<div class="card"><div class="status"><div class="s"><b id="mode">—</b><span>Modalità</span></div><div class="s"><b id="st">—</b><span>Stato</span></div><div class="s"><b id="cq">0</b><span>Domanda</span></div><div class="s"><b id="pp">0</b><span>Partecipanti</span></div><div class="s"><b id="aa">0</b><span>Risposte</span></div></div></div>
<div class="card"><h2 class="q">Configurazione</h2><div class="settings">
<div class="field"><label for="playMode">Modalità</label><select id="playMode"><option value="manual">Manuale</option><option value="auto">Automatica</option></select></div>
<div class="field"><label for="threshold">Partecipanti minimi</label><select id="threshold"><option value="3">3</option><option value="5">5</option></select></div>
<div class="field"><label for="questionSeconds">Tempo domanda</label><select id="questionSeconds"><option value="15">15 secondi</option><option value="20" selected>20 secondi</option></select></div>
<div class="field"><label for="resultSeconds">Tempo risultato</label><select id="resultSeconds"><option value="10" selected>10 secondi</option><option value="15">15 secondi</option></select></div>
</div><button class="btn" id="saveSettings" style="margin-top:15px">Salva modalità e tempi</button><div id="settingsMsg"></div></div>
<div class="card"><h2 class="q" id="qtitle">In attesa</h2><p class="muted" id="qtext">Configura o avvia il Quizzone.</p></div>
<div class="card grid"><button class="btn" id="start">Avvia Quizzone</button><button class="btn" id="close">Chiudi risposte</button><button class="btn" id="next">Prossima domanda</button><button class="btn red" id="finish">Termina Quizzone</button></div>
<div class="card"><button class="btn gray" id="reset">Reset per una nuova partita</button><div id="msg"></div></div>
<div class="card links"><b>Link utili</b><a target="_blank" href="../quizzone-monitor/">Apri monitor pubblico</a><a target="_blank" href="../quizzone/">Apri pagina partecipanti</a><a target="_blank" href="../statistiche/">Apri statistiche GiochiSAT</a></div>
</div><script>
const SUPABASE_URL=GIOCHISAT_CONFIG.supabaseUrl,SUPABASE_KEY=GIOCHISAT_CONFIG.supabaseKey,SESSION_CODE='ARPA2026';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let questions=[],state=null,settingsLoaded=false;const $=id=>document.getElementById(id);
$('toggle').onclick=()=>{const p=$('pwd');p.type=p.type==='password'?'text':'password';$('toggle').textContent=p.type==='password'?'Mostra':'Nascondi';};
async function loadQuestions(){const {data}=await sb.from('quiz_questions_public').select('*').order('position');questions=data||[];}
function sec(deadline){return deadline?Math.max(0,Math.ceil((new Date(deadline)-Date.now())/1000)):0;}
function render(){if(!state)return;$('mode').textContent=state.play_mode==='auto'?'Automatica':'Manuale';$('st').textContent=state.auto_stage||state.status;$('cq').textContent=state.current_question||0;$('pp').textContent=state.participants||0;$('aa').textContent=state.answers_received||0;const q=questions.find(x=>x.position===state.current_question);$('qtitle').textContent=q?`Domanda ${q.position} di 5`:(state.status==='finished'?'Quizzone terminato':'In attesa');const extra=state.phase_deadline?` · ${sec(state.phase_deadline)} s`:'';$('qtext').textContent=(q?q.question:(state.status==='finished'?'Riepilogo finale.':'In attesa dei partecipanti.'))+extra;$('start').disabled=state.status!=='waiting';$('close').disabled=!(state.status==='active'&&state.question_open);$('next').disabled=!(state.status==='active'&&!state.question_open&&state.current_question<5);$('finish').disabled=state.status!=='active';}
async function refresh(){const {data}=await sb.rpc('quiz_public_state_v2',{p_session_code:SESSION_CODE});state=Array.isArray(data)?data[0]:data;if(state&&!settingsLoaded){$('playMode').value=state.play_mode;$('threshold').value=String(state.auto_min_participants);$('questionSeconds').value=String(state.auto_question_seconds);$('resultSeconds').value=String(state.auto_result_seconds);settingsLoaded=true;}render();}
async function cmd(c){const pwd=$('pwd').value;if(!pwd){$('msg').innerHTML='<div class="msg warn">Inserisci la password della regia.</div>';return;}try{const {error}=await sb.rpc('quiz_admin_command',{p_password:pwd,p_command:c});if(error)throw error;$('msg').innerHTML='<div class="msg">Comando eseguito.</div>';await refresh();}catch(e){$('msg').innerHTML='<div class="msg danger">Comando non eseguito. Controlla la password o lo stato del Quizzone.</div>';}}
async function saveSettings(){const pwd=$('pwd').value;if(!pwd){$('settingsMsg').innerHTML='<div class="msg warn">Inserisci la password della regia.</div>';return;}try{const {error}=await sb.rpc('quiz_admin_settings',{p_password:pwd,p_play_mode:$('playMode').value,p_min_participants:Number($('threshold').value),p_question_seconds:Number($('questionSeconds').value),p_result_seconds:Number($('resultSeconds').value),p_final_seconds:30});if(error)throw error;$('settingsMsg').innerHTML='<div class="msg">Configurazione salvata.</div>';settingsLoaded=false;await refresh();}catch(e){$('settingsMsg').innerHTML='<div class="msg danger">Configurazione non salvata. Controlla la password.</div>';}}
$('saveSettings').onclick=saveSettings;$('start').onclick=()=>cmd('start');$('close').onclick=()=>cmd('close');$('next').onclick=()=>cmd('next');$('finish').onclick=()=>cmd('finish');$('reset').onclick=()=>{if(confirm('Il reset cancellerà partecipanti e risposte della partita corrente. Continuare?'))cmd('reset');};
(async()=>{await loadQuestions();await refresh();setInterval(refresh,1000);})();
</script></body></html>
