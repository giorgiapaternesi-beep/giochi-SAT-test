<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pagina non trovata – Giochi SAT</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#090B2A">
  <!-- GitHub Pages mostra questa pagina per ogni indirizzo sbagliato.
       La radice del sito è il primo pezzo del percorso (il nome del
       repository): così la pagina funziona anche in un repository di prova. -->
  <script>
    (function () {
      var primo = location.pathname.split("/")[1];
      var base = document.createElement("base");
      base.href = /\.github\.io$/.test(location.hostname) && primo ? "/" + primo + "/" : "/";
      document.head.appendChild(base);
    })();
  </script>
  <link rel="stylesheet" href="assets/css/giochisat.css">
  <script src="assets/config.js"></script>
  <script src="assets/js/giochisat.js"></script>
  <style>
    .vuoto{min-height:100dvh;display:grid;place-content:center;text-align:center;gap:14px;padding:24px}
    .vuoto h1{margin:0;font-size:clamp(28px,6vw,40px)}
    .vuoto p{margin:0 auto;max-width:34ch;color:var(--gs-testo-2)}
  </style>
</head>
<body class="gs">
  <main class="vuoto">
    <h1>Persi nello spazio!</h1>
    <p>Questa pagina non esiste o è stata spostata. Torna alla base e scegli un gioco.</p>
    <p><a class="gs-btn" href="./">Torna alla home</a></p>
  </main>
</body>
</html>
