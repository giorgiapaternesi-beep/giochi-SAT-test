<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
<script src="../assets/config.js"></script>
<link rel="stylesheet" href="../assets/css/giochisat.css">
<script src="../assets/js/giochisat.js"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classifica Memory Match</title>
  <style>
    :root { --ink:#aaccf8; --accent:#2188e8; --panel:#1c204f}
    * { box-sizing:border-box}
    body {
      margin:0; min-height:100vh;
      font-family:var(--gs-testo-font);
      color:var(--ink); padding:28px}
    main { width:min(1500px,100%); margin:auto}

    .institutional-header {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:24px;
      background:rgba(28,32,79,0.96);
      border-radius:20px;
      padding:12px 20px;
      margin-bottom:22px;
      box-shadow:0 10px 24px rgba(0,0,0,0.1)}
    .institutional-brand {
      display:flex;
      align-items:center;
      gap:20px;
      min-width:0}
    .institutional-logo {
      display:block;
      width:min(330px,32vw);
      max-height:82px;
      object-fit:contain;
      object-position:left center}
    .institutional-divider {
      width:2px;
      align-self:stretch;
      min-height:58px;
      background:#2d75ba;
      opacity:.7}
    .institutional-service {
      font-size:clamp(17px,1.65vw,26px);
      line-height:1.15;
      font-weight:800;
      color:#aaccf8;
      max-width:420px}
    @media (max-width:760px) {
      .institutional-header { padding:12px 14px}
      .institutional-brand { gap:12px}
      .institutional-logo { width:42vw; max-height:66px}
      .institutional-service { font-size:15px}
    }
    header { text-align:center; margin-bottom:24px}
    h1 { font-size:clamp(42px,6vw,78px); margin:0 0 8px; line-height:1}
    .sub { font-size:clamp(17px,2vw,24px); margin:0}
    .boards {
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:18px;
      align-items:start}
    .panel {
      background:var(--panel);
      border-radius:24px;
      padding:18px;
      box-shadow:0 12px 28px rgba(0,0,0,0.12)}
    .panel h2 {
      margin:0 0 12px;
      text-align:center;
      font-size:clamp(28px,3vw,42px)}
    .panel .mode {
      display:inline-block;
      min-width:90px;
      padding:7px 14px;
      border-radius:999px;
      background:var(--accent);
      color:#ffffff}
    table { width:100%; border-collapse:collapse; font-size:clamp(15px,1.6vw,22px)}
    th,td { padding:11px 7px; border-bottom:1px solid #3d6c8f; text-align:left}
    th:nth-child(1), td:nth-child(1) { width:44px; text-align:center; font-weight:900}
    th:nth-child(3), td:nth-child(3), th:nth-child(4), td:nth-child(4) { text-align:right}
    tbody tr:first-child { font-weight:900}
    .empty { text-align:center; padding:20px 8px; font-weight:700; opacity:.8}
    .updated { text-align:right; margin-top:14px; opacity:.7; font-size:14px}
    @media (max-width:1000px) {
      .boards { grid-template-columns:1fr}
    }
  </style>
</head>
<body class="gs" data-gioco="classifica-memory" style="--gs-colore:#4F7DFF">
<header class="gs-barra">
  <a class="gs-home" href="../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg><span>Home</span></a>
  <div class="gs-titolo"><i aria-hidden="true"></i><h1>Classifica Memory</h1></div>
  
  <img class="gs-logo" src="../assets/logo-arpa-lazio.jpg" alt="ARPA Lazio">
</header>

<main>

  <header>
    <h1>Memory Match</h1>
    <p class="sub">Classifica live — migliori risultati per modalità</p>
  </header>

  <section class="boards">
    <div class="panel">
      <h2><span class="mode">Difficile</span> 30 s</h2>
      <div id="empty-30" class="empty">Caricamento…</div>
      <table id="table-30" hidden>
        <thead><tr><th>#</th><th>Nickname</th><th>Tentativi</th><th>Tempo</th></tr></thead>
        <tbody id="rows-30"></tbody>
      </table>
    </div>

    <div class="panel">
      <h2><span class="mode">Media</span> 60 s</h2>
      <div id="empty-60" class="empty">Caricamento…</div>
      <table id="table-60" hidden>
        <thead><tr><th>#</th><th>Nickname</th><th>Tentativi</th><th>Tempo</th></tr></thead>
        <tbody id="rows-60"></tbody>
      </table>
    </div>

    <div class="panel">
      <h2><span class="mode">Facile</span> 90 s</h2>
      <div id="empty-90" class="empty">Caricamento…</div>
      <table id="table-90" hidden>
        <thead><tr><th>#</th><th>Nickname</th><th>Tentativi</th><th>Tempo</th></tr></thead>
        <tbody id="rows-90"></tbody>
      </table>
    </div>
  </section>

  <div id="updated" class="updated"></div>
</main>

<script>
  const SUPABASE_URL = GIOCHISAT_CONFIG.supabaseUrl;
  const SUPABASE_ANON_KEY = GIOCHISAT_CONFIG.supabaseKey;
  const TABLE_NAME = "memory_scores";
  const MODES = [30, 60, 90];

  function formatMs(ms) {
    return (ms / 1000).toFixed(2).replace(".", ",") + " s";
  }

  function bestPerNickname(rows) {
    const best = new Map();
    rows.forEach(row => {
      const key = row.nickname.trim().toLowerCase();
      const current = best.get(key);
      if (!current ||
          row.elapsed_ms < current.elapsed_ms ||
          (row.elapsed_ms === current.elapsed_ms && row.moves < current.moves)) {
        best.set(key, row);
      }
    });
    return [...best.values()]
      .sort((a,b) => a.elapsed_ms - b.elapsed_ms || a.moves - b.moves)
      .slice(0,10);
  }

  async function loadMode(mode) {
    const empty = document.getElementById(`empty-${mode}`);
    const table = document.getElementById(`table-${mode}`);
    const tbody = document.getElementById(`rows-${mode}`);

    try {
      const params = new URLSearchParams({
        select: "nickname,elapsed_ms,moves,time_limit,created_at",
        time_limit: `eq.${mode}`,
        order: "elapsed_ms.asc",
        limit: "200"
      });

      const response = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE_NAME}?${params.toString()}`, {
        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
        }
      });

      if (!response.ok) throw new Error(await response.text());
      const rows = bestPerNickname(await response.json());

      tbody.innerHTML = "";
      rows.forEach((r, i) => {
        const tr = document.createElement("tr");
        [i + 1, r.nickname, r.moves, formatMs(r.elapsed_ms)].forEach(v => {
          const td = document.createElement("td");
          td.textContent = v;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });

      if (rows.length) {
        empty.hidden = true;
        table.hidden = false;
      } else {
        empty.hidden = false;
        empty.textContent = "Nessun risultato ancora.";
        table.hidden = true;
      }
    } catch (err) {
      console.error(err);
      empty.hidden = false;
      empty.textContent = "Classifica non disponibile.";
      table.hidden = true;
    }
  }

  async function refresh() {
    await Promise.all(MODES.map(loadMode));
    document.getElementById("updated").textContent =
      "Aggiornata alle " + new Date().toLocaleTimeString("it-IT");
  }

  refresh();
  setInterval(refresh, 5000);
</script>
</body>
</html>
