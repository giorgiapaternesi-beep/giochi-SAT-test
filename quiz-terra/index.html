<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<script src="../assets/config.js"></script>
<link rel="stylesheet" href="../assets/css/giochisat.css">
<script src="../assets/js/giochisat.js"></script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Osserva la Terra - Quiz</title>
<style>
:root{
  --blu:#2f6bff; --blu-scuro:#b1c0f2; --verde:#22c55e; --verde-scuro:#b0f2c9;
  --corallo:#fb7185; --giallo:#facc15; --cielo1:#1f426b; --cielo2:#1f2458;
  --testo:#e8e5f5; --grigio:#bab5d9; --card:#1c204f; --bordo:#3d5f8f}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--gs-testo-font);color:var(--testo);min-height:100vh;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
/* nuvolette morbide sullo sfondo */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:22px 18px 80px}

/* intestazione */
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.planet{width:46px;height:46px;flex:0 0 auto}
.top h1{font-family:var(--gs-titoli-font);font-weight:700;font-size:22px;margin:0;line-height:1}
.top p{margin:3px 0 0;color:var(--grigio);font-weight:700;font-size:13px}

.btn{
  font-family:var(--gs-titoli-font);font-weight:600;font-size:18px;border:none;cursor:pointer;
  border-radius:16px;padding:15px 26px;color:#ffffff;background:var(--blu);
  box-shadow:0 8px 0 #1f4fd6, 0 12px 22px rgba(47,107,255,0.28);
  transition:transform .08s ease, box-shadow .08s ease}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(4px);box-shadow:0 4px 0 #1f4fd6, 0 6px 12px rgba(47,107,255,0.28)}
.btn.verde{background:var(--blu);box-shadow:0 8px 0 #1f4fd6,0 12px 22px rgba(47,107,255,0.28)}
.btn.verde:active{box-shadow:0 4px 0 #1f4fd6,0 6px 12px rgba(47,107,255,0.28)}
.btn:focus-visible{outline:3px solid var(--blu-scuro);outline-offset:3px}
.btn[disabled]{opacity:.4;cursor:default;transform:none}

.card{background:var(--card);border:2px solid var(--bordo);border-radius:26px;
  padding:24px;box-shadow:0 18px 40px rgba(31,43,69,0.1)}

.hidden{display:none !important}

/* ---------- schermata iniziale ---------- */
.hero{text-align:center;padding:34px 26px}
.hero .big{width:120px;height:120px;margin:2px auto 14px}
.hero h2{font-family:var(--gs-titoli-font);font-weight:700;font-size:clamp(26px,6vw,36px);margin:0 0 8px;line-height:1.1}
.hero p{color:var(--grigio);font-size:16px;font-weight:600;max-width:38ch;margin:0 auto 22px;line-height:1.5}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
.chip{background:#1c335f;color:var(--blu-scuro);font-weight:800;font-size:13px;
  padding:7px 13px;border-radius:999px}

/* ---------- barra progresso ---------- */
.progress{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bar{flex:1;height:14px;border-radius:999px;background:#233b65;position:relative;overflow:visible}
.bar .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#5b8dff,var(--blu));
  width:0;transition:width .45s cubic-bezier(.4,1.3,.5,1)}
.bar .sat{position:absolute;top:50%;left:0;transform:translate(-50%,-50%);width:30px;height:30px;
  transition:left .45s cubic-bezier(.4,1.3,.5,1)}
.count{font-family:var(--gs-titoli-font);font-weight:600;color:var(--grigio);font-size:15px;white-space:nowrap}
.count b{color:var(--blu)}

/* ---------- domanda ---------- */
.qnum{display:inline-block;background:var(--giallo);color:#fae5a8;font-weight:800;
  font-size:13px;padding:5px 12px;border-radius:999px;margin-bottom:12px}
.qtext{font-family:var(--gs-titoli-font);font-weight:600;font-size:clamp(20px,4.4vw,26px);line-height:1.25;margin:0}
.figure{margin:16px 0 4px;border-radius:18px;overflow:hidden;border:2px solid var(--bordo);background:#1f2357}
.figure img{display:block;width:100%;height:auto}
.figure .cap{font-size:13px;font-weight:700;color:var(--grigio);padding:8px 12px;background:#1e2255;
  border-top:1px solid var(--bordo)}

.options{display:grid;gap:12px;margin-top:18px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;width:100%;
  background:#1e2255;border:2px solid var(--bordo);border-radius:16px;padding:15px 16px;
  font-family:var(--gs-testo-font);font-weight:700;font-size:16.5px;color:var(--testo);
  transition:transform .07s ease,border-color .12s ease,background .12s ease}
.opt:hover:not(:disabled){border-color:var(--blu);background:#1c335f;transform:translateY(-1px)}
.opt:active:not(:disabled){transform:translateY(0)}
.opt:focus-visible{outline:3px solid var(--blu);outline-offset:2px}
.opt .key{width:34px;height:34px;flex:0 0 auto;display:grid;place-items:center;border-radius:11px;
  background:#233b65;color:var(--blu-scuro);font-family:var(--gs-titoli-font);font-weight:700;font-size:17px}
.opt .lab{flex:1;line-height:1.3}
.opt .face{width:26px;flex:0 0 auto;text-align:center;font-weight:900;font-size:20px;opacity:0}
.opt.giusta{border-color:var(--verde);background:#226137}
.opt.giusta .key{background:var(--verde);color:#ffffff}
.opt.giusta .face{opacity:1;color:var(--verde-scuro)}
.opt.sbagliata{border-color:var(--corallo);background:#1f2459}
.opt.sbagliata .key{background:var(--corallo);color:#ffffff}
.opt.sbagliata .face{opacity:1;color:#ef8199}
.opt.spenta{opacity:.5}
.opt:disabled{cursor:default}

.feedback{margin-top:16px;border-radius:16px;padding:14px 16px;display:none;font-weight:700;line-height:1.5}
.feedback.show{display:block;animation:pop .28s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.feedback.ok{background:#226137;color:#b5edcb;border:2px solid #3d8f5a}
.feedback.no{background:#1f2459;color:#eeb4b4;border:2px solid #8f3d47}
.feedback .titolo{font-family:var(--gs-titoli-font);font-weight:700;font-size:18px;display:block;margin-bottom:3px}
.feedback b{color:inherit}

.foot{display:flex;justify-content:flex-end;margin-top:18px}

/* ---------- risultato ---------- */
.result{text-align:center;padding:34px 26px}
.medal{width:130px;height:130px;margin:0 auto 8px}
.score{font-family:var(--gs-titoli-font);font-weight:700;font-size:52px;line-height:1;margin:4px 0 2px}
.score small{font-size:24px;color:var(--grigio)}
.result h2{font-family:var(--gs-titoli-font);font-weight:700;font-size:26px;margin:6px 0 6px}
.result p{color:var(--grigio);font-weight:700;font-size:16px;max-width:34ch;margin:0 auto 22px;line-height:1.5}

/* coriandoli */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:10px;height:14px;border-radius:2px;opacity:.95;
  animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

@media (max-width:520px){
  .card{padding:18px}
  .hero,.result{padding:26px 18px}
  .opt{font-size:15.5px}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
<script src="../assets/game-stats.js" defer></script>
</head>
<body class="gs" data-gioco="quiz-terra" style="--gs-colore:#2ED3A0">
<header class="gs-barra">
  <a class="gs-home" href="../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg><span>Home</span></a>
  <div class="gs-titolo"><i aria-hidden="true"></i><h1>Osserva la Terra</h1></div>
  <button class="gs-nome" type="button" aria-label="Cambia soprannome"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>Soprannome</span></button>
  <img class="gs-logo" src="../assets/logo-arpa-lazio.jpg" alt="ARPA Lazio">
</header>

<div class="wrap">

  <!-- INIZIO -->
  <section id="start">
    <div class="card hero">
      <svg class="big" viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="66" r="46" fill="#2f6bff"/>
        <path d="M20 60 q22 -12 44 -4 q20 10 5 24 q-24 12 -48 2 q-12 -12 -1 -22z" fill="#4ade80"/>
        <circle cx="40" cy="88" r="11" fill="#4ade80"/>
        <g transform="translate(94,26)"><rect x="-9" y="-9" width="18" height="18" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><rect x="-24" y="-5" width="12" height="10" rx="2" fill="#5ec6ff" stroke="#1e3a8a" stroke-width="2"/><rect x="12" y="-5" width="12" height="10" rx="2" fill="#5ec6ff" stroke="#1e3a8a" stroke-width="2"/></g>
      </svg>
      <h2>Quanto ne sai sul nostro pianeta?</h2>
      <p>Mettiti alla prova con domande facili sui satelliti che studiano la Terra e ci aiutano a proteggere l'ambiente.</p>
      <div class="chips">
        <span class="chip" id="chip-n">8 domande</span>
        <span class="chip" id="chip-tempo">Nessun tempo</span>
        <span class="chip">Solo per curiosi</span>
      </div>
      <button class="btn verde" id="go">Inizia il quiz</button>
    </div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="progress">
      <div class="bar"><div class="fill" id="fill"></div>
        <svg class="sat" id="sat" viewBox="0 0 30 30" aria-hidden="true">
          <rect x="9" y="9" width="12" height="12" rx="3" fill="#fff" stroke="#2f6bff" stroke-width="2"/>
          <rect x="1" y="11" width="7" height="8" rx="1.5" fill="#5ec6ff" stroke="#2f6bff" stroke-width="1.5"/>
          <rect x="22" y="11" width="7" height="8" rx="1.5" fill="#5ec6ff" stroke="#2f6bff" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="count">Domanda <b id="cur">1</b>/<span id="tot">8</span></div>
    </div>

    <div class="card">
      <span class="qnum" id="qnum">Domanda 1</span>
      <h3 class="qtext" id="qtext">...</h3>
      <figure class="figure" id="fig" style="display:none">
        <img id="qimg" alt="">
        <figcaption class="cap" id="qcap"></figcaption>
      </figure>
      <div id="tempo-domanda"></div>
      <div class="options" id="opts"></div>
      <div class="feedback" id="fb"><span class="titolo" id="fbt"></span><span id="fbx"></span></div>
      <div class="foot"><button class="btn" id="next" disabled>Avanti</button></div>
    </div>
  </section>

  <!-- RISULTATO -->
  <section id="end" class="hidden">
    <div class="card result">
      <svg class="medal" viewBox="0 0 120 120" aria-hidden="true">
        <path d="M40 8 L54 44 L30 44z" fill="#3b82f6"/><path d="M80 8 L90 44 L66 44z" fill="#60a5fa"/>
        <circle cx="60" cy="74" r="36" fill="#facc15" stroke="#eab308" stroke-width="5"/>
        <circle cx="60" cy="74" r="26" fill="#fde68a"/>
        <path id="medal-star" d="M60 54 l6 13 14 1 -11 9 4 14 -13 -8 -13 8 4 -14 -11 -9 14 -1z" fill="#f59e0b"/>
      </svg>
      <div class="score"><span id="right">0</span><small>/<span id="rightmax">8</span></small></div>
      <h2 id="etitle">Bravo!</h2>
      <p id="emsg">...</p>
      <button class="btn" id="again">Gioca ancora</button>
    </div>
  </section>

</div>
<div class="confetti" id="confetti"></div>

const $ = s => document.querySelector(s);
let i = 0, giuste = 0, risposto = false;

function vaiInizio(){
  if(window.GiochiSATStats) window.GiochiSATStats.recordPlay("quiz-terra");
  i = 0; giuste = 0;
  $('#tot').textContent = DOMANDE.length;
  $('#rightmax').textContent = DOMANDE.length;
  $('#start').classList.add('hidden'); $('#end').classList.add('hidden');
  $('#quiz').classList.remove('hidden');
  mostra();
}

function mostra(){
  risposto = false;
  const d = DOMANDE[i];
  $('#cur').textContent = i + 1;
  $('#qnum').textContent = 'Domanda ' + (i + 1);
  $('#qtext').textContent = d.q;

  // barra + satellite
  const perc = DOMANDE.length > 1 ? (i / (DOMANDE.length - 1)) * 100 : 0;
  $('#fill').style.width = perc + '%';
  $('#sat').style.left = perc + '%';

  // immagine
  const fig = $('#fig'), img = $('#qimg'), cap = $('#qcap');
  if (d.image){
    img.src = d.image; img.alt = '';
    img.onerror = () => { fig.style.display = 'none'; };
    fig.style.display = 'block';
    cap.style.display = 'none';
  } else { fig.style.display = 'none'; }

  // opzioni
  const box = $('#opts'); box.innerHTML = '';
  const lettere = ['A','B','C','D'];
  d.options.forEach((op, j) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span class="key">${lettere[j]}</span><span class="lab">${op}</span><span class="face"></span>`;
    b.addEventListener('click', () => scegli(j));
    box.appendChild(b);
  });

  $('#fb').className = 'feedback';
  const nx = $('#next'); nx.disabled = true;
  nx.textContent = (i === DOMANDE.length - 1) ? 'Vedi il risultato' : 'Avanti';
  tempoDomanda.ferma();
  tempoDomanda = GiochiSAT.contoAllaRovescia(LIVELLO.secondi, $('#tempo-domanda'), () => scegli(-1));
}

/* Difficoltà (vedi "livelli" in assets/config.js): secondi per domanda, 0 = senza tempo */
const LIVELLO = GiochiSAT.difficolta.parametri("quiz-terra") || { secondi: 0 };
let tempoDomanda = { ferma(){} };
if (LIVELLO.secondi) document.getElementById('chip-tempo').textContent = LIVELLO.secondi + ' secondi a domanda';

function scegli(j){
  if (risposto) return;
  risposto = true;
  tempoDomanda.ferma();
  const d = DOMANDE[i];
  const bottoni = [...document.querySelectorAll('.opt')];
  bottoni.forEach((b, k) => {
    b.disabled = true;
    if (k === d.correct){ b.classList.add('giusta'); b.querySelector('.face').textContent = '\u2713'; }
    if (k === j && j !== d.correct){ b.classList.add('sbagliata'); b.querySelector('.face').textContent = '\u2715'; }
    if (k !== d.correct && k !== j) b.classList.add('spenta');
  });

  const ok = j === d.correct;
  if (ok) giuste++;
  const fb = $('#fb');
  fb.className = 'feedback show ' + (ok ? 'ok' : 'no');
  $('#fbt').textContent = ok ? 'Giusto!' : (j < 0 ? 'Tempo scaduto!' : 'Quasi!');
  $('#fbx').innerHTML = d.why;
  $('#next').disabled = false;
}

function avanti(){
  if (i < DOMANDE.length - 1){ i++; mostra(); window.scrollTo({top:0,behavior:'smooth'}); }
  else fine();
}

function fine(){
  $('#quiz').classList.add('hidden');
  $('#end').classList.remove('hidden');
  $('#right').textContent = giuste;
  const n = DOMANDE.length, perc = giuste / n;
  let titolo, msg;
  if (perc === 1){ titolo = 'Perfetto! Sei un vero esperto'; msg = 'Hai risposto giusto a tutto: conosci i satelliti meglio di molti grandi!'; }
  else if (perc >= 0.6){ titolo = 'Bravo! Ne sai parecchio'; msg = 'Ottimo lavoro. Ancora un piccolo sforzo e fai il pieno!'; }
  else if (perc >= 0.3){ titolo = 'Buon inizio!'; msg = 'Hai imparato qualcosa di nuovo. Riprova per migliorare il punteggio.'; }
  else { titolo = 'Continua a provare!'; msg = 'Lo spazio \u00e8 pieno di sorprese: rigioca e scoprirai come i satelliti aiutano la Terra.'; }
  $('#etitle').textContent = titolo;
  $('#emsg').textContent = msg;
  window.scrollTo({top:0,behavior:'smooth'});
  if (perc >= 0.6) coriandoli();
  GiochiSAT.fineGioco("quiz-terra", { punti: giuste });
}

function coriandoli(){
  const box = $('#confetti'); box.innerHTML = '';
  const colori = ['#2f6bff','#22c55e','#facc15','#fb7185','#5ec6ff'];
  for (let k = 0; k < 90; k++){
    const c = document.createElement('i');
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colori[k % colori.length];
    c.style.animationDuration = (2.4 + Math.random() * 1.8) + 's';
    c.style.animationDelay = (Math.random() * .5) + 's';
    c.style.transform = 'rotate(' + (Math.random()*360) + 'deg)';
    box.appendChild(c);
  }
  setTimeout(() => { box.innerHTML = ''; }, 4800);
}

$('#go').addEventListener('click', vaiInizio);
$('#next').addEventListener('click', avanti);
$('#again').addEventListener('click', vaiInizio);
$('#chip-n').textContent = DOMANDE.length + ' domande';
</script>
</body>
