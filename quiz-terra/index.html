<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quizzone – Giochi SAT</title>
<script src="../assets/config.js"></script>
<link rel="stylesheet" href="../assets/css/giochisat.css">
<script src="../assets/js/giochisat.js"></script>
<script src="../assets/game-stats.js" defer></script>
<!--
  Quizzone da giocare da soli.
  Le domande NON sono in questa pagina: stanno in assets/quiz/domande.txt
  (istruzioni in cima al file). Quante domande facili, normali e difficili
  pescare per ogni difficoltà si decide in assets/config.js → livelli.
  Per controllare il file delle domande: quiz-terra/?controlla
-->
<style>
.qz{width:min(100%,720px);margin:0 auto;padding:22px var(--gs-margine) 56px}
.qz [hidden]{display:none!important}          /* anche per i pulsanti .gs-btn */
.qz-scheda{background:var(--gs-vetro);border:1px solid var(--gs-bordo);border-radius:var(--gs-r-scheda);padding:clamp(20px,4vw,30px);box-shadow:var(--gs-ombra)}
.qz-centro{text-align:center}

/* --- inizio --- */
.qz-logo{width:96px;height:96px;margin:0 auto 10px;display:block}
.qz-scheda h2{margin:0 0 8px;font-size:clamp(26px,6vw,36px)}
.qz-guida{margin:0 auto 18px;max-width:46ch;color:var(--gs-testo-2)}
.qz-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 0 22px;padding:0;list-style:none}
.qz-chips li{padding:6px 14px;border-radius:999px;background:var(--gs-superficie-2);font-size:14px;font-weight:600}

/* --- domanda --- */
.qz-testa{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.qz-passi{display:flex;gap:6px;list-style:none;margin:0;padding:0}
.qz-passi li{width:30px;height:8px;border-radius:4px;background:rgb(255 255 255 / .16)}
.qz-passi li.qz-ora{background:var(--gs-testo)}
.qz-passi li.qz-si{background:var(--gs-verde)}
.qz-passi li.qz-no{background:var(--gs-rosa)}
.qz-tag{padding:4px 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--gs-scuro);background:var(--c,var(--gs-giallo))}
.qz-numero{margin:0 0 6px;font-weight:600;color:var(--gs-testo-2);font-size:15px}
.qz-domanda{margin:0 0 6px;font-size:clamp(22px,5.4vw,30px);line-height:1.22}
.qz-tempo{min-height:6px}
.qz-risposte{display:grid;gap:12px;margin-top:16px}
.qz-risposta{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:12px 16px;border-radius:18px;
  border:2px solid var(--gs-bordo);background:var(--gs-superficie);color:var(--gs-testo);
  font:600 17px/1.35 var(--gs-testo-font);text-align:left;cursor:pointer;transition:border-color .12s,transform .12s,background .12s}
.qz-risposta:hover:not(:disabled){border-color:var(--gs-colore);transform:translateY(-1px)}
.qz-risposta .qz-n{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
  background:var(--gs-superficie-2);font:700 18px var(--gs-titoli-font)}
.qz-risposta .qz-segno{margin-left:auto;font-size:22px;font-weight:700}
.qz-risposta:disabled{cursor:default}
.qz-risposta.qz-giusta{border-color:var(--gs-verde);background:color-mix(in oklab,var(--gs-verde) 22%,var(--gs-superficie))}
.qz-risposta.qz-giusta .qz-n{background:var(--gs-verde);color:var(--gs-scuro)}
.qz-risposta.qz-sbagliata{border-color:var(--gs-rosa);background:color-mix(in oklab,var(--gs-rosa) 20%,var(--gs-superficie))}
.qz-risposta.qz-sbagliata .qz-n{background:var(--gs-rosa);color:var(--gs-scuro)}
.qz-risposta.qz-spenta{opacity:.55}
.qz-esito{margin-top:16px;padding:14px 16px;border-radius:16px;background:var(--gs-superficie);border-left:5px solid var(--gs-bordo)}
.qz-esito b.qz-titolo{display:block;font:700 18px var(--gs-titoli-font);margin-bottom:2px}
.qz-esito.qz-si{border-color:var(--gs-verde)} .qz-esito.qz-si b.qz-titolo{color:var(--gs-verde)}
.qz-esito.qz-no{border-color:var(--gs-rosa)}  .qz-esito.qz-no b.qz-titolo{color:var(--gs-rosa)}
.qz-esito p{margin:0;color:var(--gs-testo-2)}
.qz-esito p b{color:var(--gs-testo)}
.qz-piede{display:flex;justify-content:flex-end;margin-top:18px}

/* --- risultato --- */
.qz-punti{font:700 clamp(56px,14vw,84px)/1 var(--gs-titoli-font);color:var(--gs-colore);margin:6px 0 4px}
.qz-punti small{font-size:.45em;color:var(--gs-testo-2)}
.qz-riepilogo{list-style:none;margin:20px 0 22px;padding:0;display:grid;gap:8px;text-align:left}
.qz-riepilogo li{display:grid;grid-template-columns:28px 1fr;gap:4px 10px;padding:10px 14px;border-radius:14px;background:var(--gs-superficie)}
.qz-riepilogo .qz-v{grid-row:span 2;font-weight:700;font-size:18px}
.qz-riepilogo .qz-v.qz-si{color:var(--gs-verde)} .qz-riepilogo .qz-v.qz-no{color:var(--gs-rosa)}
.qz-riepilogo span{font-size:15px}
.qz-riepilogo small{color:var(--gs-testo-2);font-size:13.5px}
.qz-azioni{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}

/* --- controllo del file (quiz-terra/?controlla) --- */
.qz-controllo h2{font-size:24px}
.qz-controllo table{width:100%;border-collapse:collapse;margin:10px 0 18px;font-size:15px}
.qz-controllo th,.qz-controllo td{padding:8px 10px;border-bottom:1px solid var(--gs-bordo);text-align:left;vertical-align:top}
.qz-controllo .qz-ok{color:var(--gs-verde);font-weight:700}
.qz-controllo .qz-ko{color:var(--gs-rosa);font-weight:700}
.qz-controllo details{margin-top:8px}
.qz-controllo summary{cursor:pointer;font-weight:600}

.qz-coriandoli{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.qz-coriandoli i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:qz-cade linear forwards}
@keyframes qz-cade{to{transform:translateY(105vh) rotate(540deg)}}

@media (max-width:520px){
  .qz{padding-top:14px}
  .qz-risposta{min-height:56px;font-size:16px;padding:10px 12px;gap:12px}
  .qz-passi li{width:22px}
}
@media (prefers-reduced-motion:reduce){.qz-risposta{transition:none}.qz-coriandoli{display:none}}
</style>
</head>
<body class="gs" data-gioco="quiz-terra" style="--gs-colore:#2ED3A0">
<header class="gs-barra">
  <a class="gs-home" href="../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg><span>Home</span></a>
  <div class="gs-titolo"><i aria-hidden="true"></i><h1>Quizzone</h1></div>
  <button class="gs-nome" type="button" aria-label="Cambia soprannome"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>Soprannome</span></button>
  <img class="gs-logo" src="../assets/logo-arpa-lazio.jpg" alt="ARPA Lazio">
</header>

<main class="qz">

  <!-- INIZIO -->
  <section id="inizio" class="qz-scheda qz-centro">
    <svg class="qz-logo" viewBox="0 0 96 96" aria-hidden="true">
      <circle cx="48" cy="50" r="30" fill="#4F7DFF"/>
      <path d="M26 46c8-6 16-2 22 1s12 1 16-3c2 6 1 13-3 18-8 2-14-3-20-3s-10 3-13 1c-3-4-4-9-2-14z" fill="#2ED3A0"/>
      <ellipse cx="48" cy="50" rx="44" ry="14" fill="none" stroke="#FFC93C" stroke-width="3" stroke-dasharray="5 6" transform="rotate(-18 48 50)"/>
      <circle cx="84" cy="36" r="9" fill="#FFC93C"/>
      <text x="84" y="41" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-weight="700" font-size="14" fill="#14123F">?</text>
    </svg>
    <h2>Quanto ne sai di satelliti e ambiente?</h2>
    <p class="qz-guida">Cinque domande pescate a sorpresa. Dopo ogni risposta scopri perché è giusta: ogni partita è diversa.</p>
    <ul class="qz-chips" id="chips"></ul>
    <button class="gs-btn" id="via" type="button" disabled>Caricamento…</button>
    <p class="gs-errore" id="errore" role="alert"></p>
  </section>

  <!-- DOMANDA -->
  <section id="gioco" class="qz-scheda" hidden>
    <div class="qz-testa">
      <ol class="qz-passi" id="passi" aria-hidden="true"></ol>
      <span class="qz-tag" id="tag"></span>
    </div>
    <p class="qz-numero" id="numero"></p>
    <h2 class="qz-domanda" id="domanda"></h2>
    <div class="qz-tempo" id="tempo"></div>
    <div class="qz-risposte" id="risposte"></div>
    <div class="qz-esito" id="esito" aria-live="polite" hidden><b class="qz-titolo" id="esito-titolo"></b><p id="esito-testo"></p></div>
    <div class="qz-piede"><button class="gs-btn" id="avanti" type="button" hidden>Avanti</button></div>
  </section>

  <!-- RISULTATO -->
  <section id="fine" class="qz-scheda qz-centro" hidden>
    <div class="qz-punti"><span id="punti">0</span><small>/<span id="totale">5</span></small></div>
    <h2 id="fine-titolo"></h2>
    <p class="qz-guida" id="fine-testo"></p>
    <ol class="qz-riepilogo" id="riepilogo"></ol>
    <div class="qz-azioni">
      <button class="gs-btn" id="ancora" type="button">Gioca ancora</button>
      <a class="gs-btn gs-secondario" href="../esercitazione/singleplayer/">Altri giochi</a>
    </div>
  </section>

  <!-- CONTROLLO DEL FILE DELLE DOMANDE (solo con ?controlla nell'indirizzo) -->
  <section id="controllo" class="qz-scheda qz-controllo" hidden></section>

</main>
<div class="qz-coriandoli" id="coriandoli" aria-hidden="true"></div>

<script>
(function () {
  "use strict";

  var ID = "quiz-terra";
  var FILE_DOMANDE = GiochiSAT.url("assets/quiz/domande.txt");
  var ORDINE = ["facile", "normale", "difficile"];
  var NOMI = { facile: "Facile", normale: "Normale", difficile: "Difficile" };
  var COLORI = { facile: "var(--gs-verde)", normale: "var(--gs-giallo)", difficile: "var(--gs-rosa)" };
  var VICINE = { facile: ["normale", "difficile"], normale: ["facile", "difficile"], difficile: ["normale", "facile"] };

  /* Difficoltà della partita (assets/config.js → livelli → "quiz-terra"):
     domande = quante domande pescare per ogni difficoltà; secondi = tempo per domanda (0 = senza tempo) */
  var LIVELLO = GiochiSAT.difficolta.parametri(ID) || { domande: { facile: 1, normale: 3, difficile: 1 }, secondi: 0 };
  var QUANTE = LIVELLO.domande || {};

  var $ = function (id) { return document.getElementById(id); };
  var tutte = [], partita = [], indice = 0, giuste = 0, risposto = false, tempo = { ferma: function () {} };

  /* ---------- Lettura del file delle domande ---------------------------
     Formato (vedi le istruzioni in cima a domande.txt):
       [facile] Testo della domanda
       + risposta giusta
       - risposta sbagliata
       > spiegazione                                                     */
  function leggiDomande(testo) {
    var domande = [], errori = [], d = null;
    function errore(riga, msg) { errori.push({ riga: riga, testo: msg }); }
    function chiudi() {
      if (!d) return;
      var n = d.risposte.length, buone = d.risposte.filter(function (r) { return r.giusta; }).length;
      if (d.scarta) { /* errore già segnalato */ }
      else if (!d.testo) errore(d.riga, "manca il testo della domanda");
      else if (n < 2) errore(d.riga, "servono almeno 2 risposte");
      else if (n > 4) errore(d.riga, "al massimo 4 risposte (ce ne sono " + n + ")");
      else if (buone === 0) errore(d.riga, "manca la risposta giusta: mettere + davanti");
      else if (buone > 1) errore(d.riga, "c'è più di una risposta giusta (+)");
      else domande.push(d);
      d = null;
    }
    testo.replace(/^﻿/, "").split(/\r\n|\r|\n/).forEach(function (grezza, i) {
      var riga = i + 1, t = grezza.trim();
      if (!t || t.charAt(0) === "#") return;                           // righe vuote e note
      var m = t.match(/^\[([^\]]*)\]\s*(.*)$/);
      if (m) {                                                           // inizio di una nuova domanda
        chiudi();
        var livello = m[1].trim().toLowerCase();
        if (livello === "media") livello = "normale";
        d = { riga: riga, livello: livello, testo: m[2].trim(), risposte: [], spiegazione: "" };
        if (ORDINE.indexOf(livello) < 0) { d.scarta = true; errore(riga, 'difficoltà "' + m[1].trim() + '" sconosciuta: usare facile, normale o difficile'); }
        return;
      }
      if (!d) { errore(riga, "riga fuori da una domanda: ogni domanda inizia con [facile], [normale] o [difficile]"); return; }
      var segno = t.charAt(0), resto = t.slice(1).trim();
      if (segno === "+" || segno === "-" || segno === "–") {
        if (resto) d.risposte.push({ testo: resto, giusta: segno === "+" });
        else errore(riga, "risposta vuota");
      } else if (segno === ">") {
        d.spiegazione += (d.spiegazione ? " " : "") + resto;
      } else if (!d.risposte.length && !d.spiegazione) {
        d.testo += (d.testo ? " " : "") + t;                             // domanda scritta su più righe
      } else {
        errore(riga, "riga non riconosciuta: le risposte iniziano con + o -, la spiegazione con >");
      }
    });
    chiudi();
    return { domande: domande, errori: errori };
  }

  function mescola(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var x = a[i]; a[i] = a[j]; a[j] = x; }
    return a;
  }

  /* Pesca le domande della partita: prima quelle della difficoltà richiesta,
     poi, se non bastano, quelle della difficoltà più vicina. */
  function pesca() {
    var gruppi = {}, scelte = [];
    ORDINE.forEach(function (l) { gruppi[l] = mescola(tutte.filter(function (d) { return d.livello === l; })); });
    ORDINE.forEach(function (l) {
      var n = Number(QUANTE[l]) || 0;
      var prese = gruppi[l].splice(0, n);
      VICINE[l].forEach(function (v) { if (prese.length < n) prese = prese.concat(gruppi[v].splice(0, n - prese.length)); });
      scelte = scelte.concat(prese);
    });
    // dalla più facile alla più difficile
    return scelte.sort(function (a, b) { return ORDINE.indexOf(a.livello) - ORDINE.indexOf(b.livello); });
  }

  function testoSicuro(s) { return GiochiSAT.testo(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"); }
  function plurale(livello, n) { return Number(n) === 1 ? livello : livello.replace(/e$/, "i"); }   // facile → facili
  function quanteTotali() { return ORDINE.reduce(function (s, l) { return s + (Number(QUANTE[l]) || 0); }, 0); }
  function mostraSolo(id) { ["inizio", "gioco", "fine"].forEach(function (x) { $(x).hidden = x !== id; }); window.scrollTo({ top: 0 }); }

  /* ---------- Schermata iniziale ------------------------------------- */
  function preparaInizio() {
    var mix = ORDINE.filter(function (l) { return QUANTE[l]; }).map(function (l) { return QUANTE[l] + " " + plurale(l, QUANTE[l]); });
    var voci = [Math.min(quanteTotali(), tutte.length) + " domande", mix.join(" · "), LIVELLO.secondi ? LIVELLO.secondi + " secondi a domanda" : "Senza tempo"];
    $("chips").innerHTML = voci.map(function (v) { return "<li>" + GiochiSAT.testo(v) + "</li>"; }).join("");
    $("via").disabled = false;
    $("via").textContent = "Inizia il quiz";
  }

  /* ---------- Partita ------------------------------------------------- */
  function inizia() {
    if (window.GiochiSATStats) window.GiochiSATStats.recordPlay(ID);
    partita = pesca().map(function (d) { return { d: d, risposte: mescola(d.risposte), scelta: null }; });
    indice = 0; giuste = 0;
    $("passi").innerHTML = partita.map(function () { return "<li></li>"; }).join("");
    mostraSolo("gioco");
    mostraDomanda();
  }

  function mostraDomanda() {
    risposto = false;
    var p = partita[indice], d = p.d;
    [].forEach.call($("passi").children, function (li, i) { li.classList.toggle("qz-ora", i === indice); });
    $("tag").textContent = NOMI[d.livello];
    $("tag").style.setProperty("--c", COLORI[d.livello]);
    $("numero").textContent = "Domanda " + (indice + 1) + " di " + partita.length;
    $("domanda").textContent = d.testo;
    $("risposte").innerHTML = "";
    p.risposte.forEach(function (r, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "qz-risposta";
      b.innerHTML = '<span class="qz-n">' + (i + 1) + '</span><span></span><span class="qz-segno" aria-hidden="true"></span>';
      b.children[1].textContent = r.testo;
      b.addEventListener("click", function () { rispondi(i); });
      $("risposte").appendChild(b);
    });
    $("esito").hidden = true;
    $("avanti").hidden = true;
    $("avanti").textContent = indice === partita.length - 1 ? "Vedi il risultato" : "Avanti";
    tempo.ferma();
    tempo = GiochiSAT.contoAllaRovescia(LIVELLO.secondi, $("tempo"), function () { rispondi(-1); });
  }

  function rispondi(i) {
    if (risposto) return;
    risposto = true;
    tempo.ferma();
    var p = partita[indice], ok = i >= 0 && p.risposte[i].giusta;
    p.scelta = i;
    if (ok) giuste++;
    [].forEach.call($("risposte").children, function (b, k) {
      b.disabled = true;
      var giusta = p.risposte[k].giusta;
      if (giusta) { b.classList.add("qz-giusta"); b.lastChild.textContent = "✓"; }
      else if (k === i) { b.classList.add("qz-sbagliata"); b.lastChild.textContent = "✕"; }
      else b.classList.add("qz-spenta");
    });
    $("passi").children[indice].classList.add(ok ? "qz-si" : "qz-no");
    $("esito").className = "qz-esito " + (ok ? "qz-si" : "qz-no");
    $("esito-titolo").textContent = ok ? "Giusto!" : (i < 0 ? "Tempo scaduto!" : "Non proprio…");
    $("esito-testo").innerHTML = p.d.spiegazione ? testoSicuro(p.d.spiegazione) : "";
    $("esito").hidden = false;
    $("avanti").hidden = false;
    $("avanti").focus({ preventScroll: true });
  }

  function avanti() {
    if (indice < partita.length - 1) { indice++; mostraDomanda(); $("domanda").scrollIntoView({ block: "nearest" }); }
    else fine();
  }

  function fine() {
    tempo.ferma();
    var n = partita.length, perc = n ? giuste / n : 0, titolo, msg;
    if (perc === 1) { titolo = "Perfetto!"; msg = "Hai risposto giusto a tutto: conosci i satelliti meglio di molti grandi!"; }
    else if (perc >= 0.6) { titolo = "Bravo! Ne sai parecchio"; msg = "Ottimo lavoro. Ancora un piccolo sforzo e fai il pieno!"; }
    else if (perc >= 0.3) { titolo = "Buon inizio!"; msg = "Hai imparato qualcosa di nuovo. Rigioca: le domande cambiano ogni volta."; }
    else { titolo = "Continua a provare!"; msg = "Lo spazio è pieno di sorprese: rigioca e scoprirai come i satelliti aiutano la Terra."; }
    $("punti").textContent = giuste;
    $("totale").textContent = n;
    $("fine-titolo").textContent = titolo;
    $("fine-testo").textContent = msg;
    $("riepilogo").innerHTML = partita.map(function (p) {
      var ok = p.scelta >= 0 && p.risposte[p.scelta].giusta;
      var giusta = p.risposte.filter(function (r) { return r.giusta; })[0];
      return '<li><b class="qz-v ' + (ok ? "qz-si" : "qz-no") + '" aria-label="' + (ok ? "Giusta" : "Sbagliata") + '">' + (ok ? "✓" : "✕") + "</b>" +
        "<span>" + GiochiSAT.testo(p.d.testo) + "</span><small>Risposta giusta: " + GiochiSAT.testo(giusta.testo) + "</small></li>";
    }).join("");
    mostraSolo("fine");
    if (perc >= 0.6) coriandoli();
    GiochiSAT.fineGioco(ID, { punti: giuste });
  }

  function coriandoli() {
    if (GiochiSAT.movimentoRidotto) return;
    var box = $("coriandoli"), colori = ["#FFC93C", "#2ED3A0", "#4F7DFF", "#FF5C8A", "#5CC8FF"];
    box.innerHTML = "";
    for (var k = 0; k < 80; k++) {
      var c = document.createElement("i");
      c.style.left = Math.random() * 100 + "vw";
      c.style.background = colori[k % colori.length];
      c.style.animationDuration = (2.2 + Math.random() * 1.8) + "s";
      c.style.animationDelay = Math.random() * 0.5 + "s";
      box.appendChild(c);
    }
    setTimeout(function () { box.innerHTML = ""; }, 4800);
  }

  /* ---------- Controllo del file: quiz-terra/?controlla ---------------- */
  function controllo(esito) {
    var conta = {};
    ORDINE.forEach(function (l) { conta[l] = esito.domande.filter(function (d) { return d.livello === l; }).length; });
    var livelli = (GIOCHISAT_CONFIG.livelli || {})[ID] || {};
    var righeLivelli = GiochiSAT.difficolta.elenco.map(function (g) {
      var q = (livelli[g] || {}).domande || {};
      var bastano = ORDINE.every(function (l) { return (Number(q[l]) || 0) <= conta[l]; });
      var richiesta = ORDINE.filter(function (l) { return q[l]; }).map(function (l) { return q[l] + " " + plurale(l, q[l]); }).join(", ");
      return "<tr><td>" + GiochiSAT.difficolta.nome(g) + "</td><td>" + richiesta + "</td><td class=\"" + (bastano ? "qz-ok\">Bastano" : "qz-ko\">Non bastano: verranno prese da altre difficoltà") + "</td></tr>";
    }).join("");
    var errori = esito.errori.length
      ? "<p class=\"qz-ko\">Domande ignorate perché scritte male:</p><ul>" + esito.errori.map(function (e) { return "<li>Riga " + e.riga + ": " + GiochiSAT.testo(e.testo) + "</li>"; }).join("") + "</ul>"
      : "<p class=\"qz-ok\">Nessun errore: tutte le domande sono scritte bene.</p>";
    var elenco = ORDINE.map(function (l) {
      return "<details><summary>" + NOMI[l] + " (" + conta[l] + ")</summary><ol>" + esito.domande.filter(function (d) { return d.livello === l; }).map(function (d) {
        var g = d.risposte.filter(function (r) { return r.giusta; })[0];
        return "<li>" + GiochiSAT.testo(d.testo) + " <small>— giusta: " + GiochiSAT.testo(g.testo) + " (riga " + d.riga + ")</small></li>";
      }).join("") + "</ol></details>";
    }).join("");
    $("controllo").innerHTML = "<h2>Controllo delle domande</h2>" +
      "<p>File: <code>assets/quiz/domande.txt</code> · " + esito.domande.length + " domande valide (" + ORDINE.map(function (l) { return conta[l] + " " + plurale(l, conta[l]); }).join(", ") + ").</p>" +
      errori +
      "<table><thead><tr><th>Partita</th><th>Domande pescate</th><th>Nel file</th></tr></thead><tbody>" + righeLivelli + "</tbody></table>" + elenco;
    $("controllo").hidden = false;
  }

  /* ---------- Avvio ---------------------------------------------------- */
  $("via").addEventListener("click", inizia);
  $("avanti").addEventListener("click", avanti);
  $("ancora").addEventListener("click", inizia);
  document.addEventListener("keydown", function (e) {
    if ($("gioco").hidden || e.altKey || e.ctrlKey || e.metaKey) return;
    var n = parseInt(e.key, 10);
    if (!risposto && n >= 1 && n <= partita[indice].risposte.length) rispondi(n - 1);
  });

  fetch(FILE_DOMANDE, { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(function (testo) {
      var esito = leggiDomande(testo);
      tutte = esito.domande;
      if (esito.errori.length && window.console) console.warn("Quizzone – domande ignorate:", esito.errori);
      if (/[?&]controlla\b/.test(location.search)) controllo(esito);
      if (!tutte.length) throw new Error("nessuna domanda valida");
      preparaInizio();
    })
    .catch(function () {
      $("via").textContent = "Inizia il quiz";
      $("errore").textContent = "Non riesco a caricare le domande. Controlla la connessione e ricarica la pagina.";
    });
})();
</script>
</body>
</html>
