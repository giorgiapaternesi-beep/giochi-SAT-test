<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<script src="../assets/config.js"></script>
<link rel="stylesheet" href="../assets/css/giochisat.css">
<script src="../assets/js/giochisat.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sfida del sensore - Giochi SAT</title>
<style>
:root{--blu:#2f6bff;--blu2:#b1c0f2;--verde:#15803d;--rosso:#dc2626;--testo:#e8e5f5;--muted:#bab5d9;--bordo:#3d648f}
*{box-sizing:border-box}html,body{margin:0}body{font-family:var(--gs-testo-font);color:var(--testo);min-height:100vh}
.wrap{max-width:650px;margin:auto;padding:16px 12px 40px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:10px}.logo{width:48px;height:48px}.top h1{margin:0;color:#b1d2f1;font-size:clamp(24px,6vw,34px)}.top p{margin:3px 0 0;color:var(--muted);font-weight:700;font-size:13px}.home{padding:9px 11px;border:2px solid var(--bordo);border-radius:12px;background:#1c204f;color:var(--blu2);font-weight:800;text-decoration:none;white-space:nowrap}
.card{background:#1c204f;border:2px solid var(--bordo);border-radius:23px;padding:21px;box-shadow:0 15px 35px rgba(30,64,110,0.12);margin-bottom:13px}.hidden{display:none!important}.center{text-align:center}.center h2{color:#b1d2f1;margin:2px 0 8px}.center p{color:var(--muted);line-height:1.45}
label{display:block;text-align:left;font-weight:800;margin:16px 0 6px}input{width:100%;border:2px solid var(--bordo);border-radius:13px;padding:13px;font-size:17px;color:var(--testo)}input:focus{outline:3px solid #3d618f;border-color:var(--blu)}
.actions{display:grid;gap:10px;margin-top:15px}.btn{border:0;border-radius:13px;padding:13px 15px;font-size:16px;font-weight:800;cursor:pointer;background:var(--blu);color:#ffffff}.btn.secondary{background:#1c204f;color:var(--blu2);border:2px solid var(--bordo)}.btn[disabled]{opacity:.45;cursor:default}.error{color:var(--rosso)!important;font-weight:800;min-height:22px}.note{font-size:13px}.pulse{width:54px;height:54px;margin:12px auto;border-radius:50%;border:6px solid #3d608f;border-top-color:var(--blu);animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.scorebar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}.player{background:#1e2357;border-radius:14px;padding:10px}.player.right{text-align:right}.player b{display:block;color:var(--blu2);font-size:21px}.versus{font-weight:900;color:var(--muted)}.round{color:var(--muted);font-weight:800;text-align:center;margin:12px 0 5px}.timer{text-align:center;font-size:34px;font-weight:900;color:var(--blu2)}
.problem{font-size:19px;line-height:1.4;text-align:center;margin:9px 0 17px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{border:2px solid var(--bordo);border-radius:15px;padding:14px 8px;background:#1d2254;color:var(--blu2);font-weight:900;cursor:pointer}.answer:hover,.answer:focus-visible{border-color:var(--blu);outline:none}.answer.chosen{background:#20416d;border-color:var(--blu)}.answer.correct{background:#206e3b;border-color:#22c55e;color:#b4efca}.answer.wrong{background:#681e1e;border-color:#ef4444;color:#f1b1b1}
.message{text-align:center;font-weight:800;line-height:1.45;margin:15px 0 2px}.explain{margin-top:12px;background:#1e2356;border-radius:14px;padding:13px;line-height:1.45;color:#e8e5f5}.resultline{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--bordo);padding:9px 0;font-weight:800}.winner{font-size:27px;color:var(--blu2);margin:8px 0}.linkbox{word-break:break-all;background:#1e2357;border-radius:12px;padding:10px;font-size:13px;color:#e8e5f5}
@media(max-width:430px){.wrap{padding:10px 8px 28px}.card{padding:16px}.answers{grid-template-columns:1fr}.logo{width:42px;height:42px}.scorebar{gap:5px}.player{font-size:13px}.player b{font-size:18px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<script src="../assets/game-stats.js" defer></script>
</head>
<body class="gs" data-gioco="sensore-sfida" style="--gs-colore:#FFC93C">
<header class="gs-barra">
  <a class="gs-home" href="../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg><span>Home</span></a>
  <div class="gs-titolo"><i aria-hidden="true"></i><h1>Sfida del sensore</h1></div>
  <button class="gs-nome" type="button" aria-label="Cambia soprannome"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>Soprannome</span></button>
  <img class="gs-logo" src="../assets/logo-arpa-lazio.jpg" alt="ARPA Lazio">
</header>
<main class="wrap">

<section class="card center" id="setup"><h2 id="setupTitle">Sfida un avversario</h2><p id="setupText">Cerca automaticamente una sfida aperta oppure creane una nuova.</p><label for="nickname">Il tuo nome o soprannome</label><input id="nickname" maxlength="15" autocomplete="nickname" placeholder="Da 2 a 15 caratteri"><div class="actions" id="setupActions"><button class="btn" id="random">Cerca uno sfidante</button><button class="btn secondary" id="invite">Invita con un link</button><a class="btn secondary" href="../sensore-adatto/" style="text-decoration:none">Gioca da solo</a></div><p class="error" id="setupError"></p></section>

<section class="card center hidden" id="waiting"><div class="pulse"></div><h2>In attesa di un avversario…</h2><p id="waitingText">La tua sfida è disponibile per il prossimo giocatore.</p><div id="shareArea" class="hidden"><div class="linkbox" id="shareLink"></div><button class="btn" id="copy" style="margin-top:10px">Copia il link</button></div><div class="actions"><button class="btn secondary" id="waitMore">Continua ad aspettare</button><button class="btn secondary" id="cancel">Annulla e gioca da solo</button></div><p class="note" id="waitNote"></p></section>

<section class="card hidden" id="play"><div class="scorebar"><div class="player"><span id="p1name">Giocatore 1</span><b id="p1score">0</b></div><div class="versus">VS</div><div class="player right"><span id="p2name">Giocatore 2</span><b id="p2score">0</b></div></div><div class="round" id="roundLabel"></div><div class="timer" id="timer"></div><h2 class="problem" id="question"></h2><div class="answers" id="answers"></div><p class="message" id="playMessage"></p><div class="explain hidden" id="explain"></div></section>

<section class="card center hidden" id="final"><div class="winner" id="winner"></div><p id="finalText"></p><div id="finalScores"></div><div class="actions"><button class="btn" id="newChallenge">Nuova sfida</button><a class="btn secondary" href="../sensore-adatto/" style="text-decoration:none">Gioca da solo</a></div></section>
</main>
<script>
(()=>{"use strict";
const URL=GIOCHISAT_CONFIG.supabaseUrl,KEY=GIOCHISAT_CONFIG.supabaseKey;
const SENSORS=[{id:"termico",name:"Termico IR"},{id:"radar",name:"Radar"},{id:"multi",name:"Multispettrale"},{id:"ottico",name:"Ottico HR"}];
const QUESTIONS=[
 {p:"Incendio boschivo",q:"Sul globo è scoppiato un incendio. Con quale sensore lo rilevi meglio?",a:"termico",e:"Il sensore termico a infrarossi individua il calore del fuoco, anche di notte."},
 {p:"Alluvione",q:"Un fiume ha allagato i campi, ma è tutto nuvoloso. Quale sensore usi?",a:"radar",e:"Il radar attraversa le nuvole e distingue bene le superfici allagate."},
 {p:"Deforestazione",q:"Una foresta è stata tagliata. Quale sensore se ne accorge?",a:"multi",e:"Il multispettrale misura la luce riflessa dalla vegetazione e permette confronti nel tempo."},
 {p:"Nuova urbanizzazione",q:"Sono comparsi nuovi edifici e strade. Quale sensore mostra i dettagli?",a:"ottico",e:"L’ottico ad alta risoluzione mostra con nitidezza edifici e infrastrutture."},
 {p:"Frana",q:"Un versante si sta muovendo di pochi millimetri. Quale sensore lo misura?",a:"radar",e:"Il radar interferometrico può misurare spostamenti molto piccoli del terreno."},
 {p:"Alghe nel lago",q:"Un lago è diventato verde. Quale sensore può rilevare le alghe?",a:"multi",e:"Il multispettrale analizza il colore dell’acqua e può rilevare la clorofilla."}
];
const $=id=>document.getElementById(id);let token=localStorage.getItem("giochisat_duel_token");if(!token){token=crypto.randomUUID();localStorage.setItem("giochisat_duel_token",token)}let duelId=null,state=null,poll=null,viewKey="",waitStarted=0;
async function rpc(name,args={}){const r=await fetch(`${URL}/rest/v1/rpc/${name}`,{method:"POST",headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,"Content-Type":"application/json"},body:JSON.stringify(args)});const body=await r.json().catch(()=>null);if(!r.ok)throw new Error(body?.message||"Collegamento non riuscito");return body}
function show(id){["setup","waiting","play","final"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}
function nickname(){const n=$("nickname").value.trim();if(n.length<2){$("setupError").textContent="Inserisci almeno due caratteri.";return null}GiochiSAT.nome.set(n);return n}
async function start(kind){const n=nickname();if(!n)return;$("setupError").textContent="";try{const d=kind==="random"?await rpc("sensor_duel_match",{p_token:token,p_name:n}):await rpc("sensor_duel_create",{p_token:token,p_name:n,p_access_mode:"invite"});duelId=d.duel_id;history.replaceState(null,"",`?duel=${duelId}`);if(window.GiochiSATStats)window.GiochiSATStats.recordPlay("sensore-adatto");show("waiting");waitStarted=Date.now();if(kind==="invite"){const link=`${location.origin}${location.pathname}?invite=${duelId}`;$("shareLink").textContent=link;$("shareArea").classList.remove("hidden");$("waitingText").textContent="Invia questo collegamento alla persona che vuoi sfidare."}beginPolling()}catch(e){$("setupError").textContent=e.message}}
async function join(id){const n=nickname();if(!n)return;try{await rpc("sensor_duel_join",{p_duel_id:id,p_token:token,p_name:n});duelId=id;history.replaceState(null,"",`?duel=${id}`);if(window.GiochiSATStats)window.GiochiSATStats.recordPlay("sensore-adatto");show("play");beginPolling()}catch(e){$("setupError").textContent=e.message}}
function beginPolling(){if(poll)clearInterval(poll);refresh();poll=setInterval(refresh,800)}
async function refresh(){if(!duelId)return;try{state=await rpc("sensor_duel_state",{p_duel_id:duelId,p_token:token});render()}catch(e){$("waitNote").textContent=e.message}}
function left(deadline){return Math.max(0,Math.ceil((new Date(deadline)-Date.now())/1000))}
function answered(s){return s.slot===1?s.player1_answered:s.player2_answered}
function render(){if(state.status==="waiting"){show("waiting");if(Date.now()-waitStarted>30000)$("waitNote").textContent="Non è ancora disponibile uno sfidante. Puoi continuare ad aspettare oppure giocare da solo.";return}if(state.status==="cancelled"){show("final");$("winner").textContent="Sfida terminata";$("finalText").textContent="La sfida non è più disponibile.";return}if(state.status==="finished"){renderFinal();return}show("play");$("p1name").textContent=state.player1_name;$("p2name").textContent=state.player2_name||"In attesa";$("p1score").textContent=state.player1_score;$("p2score").textContent=state.player2_score;
 if(state.phase==="countdown"){$("roundLabel").textContent="Avversario trovato";$("timer").textContent=left(state.started_at);$("question").textContent="La sfida sta per iniziare";$("answers").innerHTML="";$("playMessage").textContent="Preparatevi: riceverete le stesse sei domande.";$("explain").classList.add("hidden");return}
 const q=QUESTIONS[state.question_index],key=state.phase+state.question_index;if(key!==viewKey){viewKey=key;$("roundLabel").textContent=`Domanda ${state.question_index+1} di ${QUESTIONS.length} · ${q.p}`;$("question").textContent=q.q;$("answers").innerHTML=SENSORS.map(s=>`<button class="answer" data-id="${s.id}">${s.name}</button>`).join("");$("answers").querySelectorAll("button").forEach(b=>b.onclick=()=>answer(b.dataset.id));$("explain").classList.add("hidden")}
 $("timer").textContent=state.phase==="question"?left(state.phase_deadline):"Soluzione";
 if(state.phase==="question"){const done=answered(state);$("answers").querySelectorAll("button").forEach(b=>b.disabled=done);$("playMessage").textContent=done?"Risposta registrata. Attendi l’avversario…":"Scegli il sensore più adatto."}
 else if(state.phase==="result"){const mine=state.slot===1?state.player1_answer:state.player2_answer,pts=state.slot===1?state.player1_points:state.player2_points;$("answers").querySelectorAll("button").forEach(b=>{b.disabled=true;b.classList.toggle("correct",b.dataset.id===q.a);b.classList.toggle("wrong",b.dataset.id===mine&&mine!==q.a)});$("playMessage").textContent=mine?`Hai ottenuto ${pts} punti.`:"Tempo scaduto: nessuna risposta.";$("explain").textContent=q.e;$("explain").classList.remove("hidden")}}
async function answer(id){try{const r=await rpc("sensor_duel_answer",{p_duel_id:duelId,p_token:token,p_sensor_id:id});$("answers").querySelectorAll("button").forEach(b=>{b.disabled=true;b.classList.toggle("chosen",b.dataset.id===id)});$("playMessage").textContent=`Risposta registrata${r.correct?` · +${r.points} punti`:""}. Attendi l’avversario…`;refresh()}catch(e){$("playMessage").textContent=e.message}}
function renderFinal(){show("final");if(poll)clearInterval(poll);const a=state.player1_score,b=state.player2_score;$("winner").textContent=a===b?"Pareggio!":`${a>b?state.player1_name:state.player2_name} vince!`;$("finalText").textContent="Sfida completata. La correttezza vale più della velocità.";$("finalScores").innerHTML=`<div class="resultline"><span>${state.player1_name}</span><span>${a} punti</span></div><div class="resultline"><span>${state.player2_name}</span><span>${b} punti</span></div>`}
async function cancel(){if(duelId)await rpc("sensor_duel_cancel",{p_duel_id:duelId,p_token:token}).catch(()=>{});location.href="../sensore-adatto/"}
$("nickname").value=GiochiSAT.nome.get();$("random").onclick=()=>start("random");$("invite").onclick=()=>start("invite");$("cancel").onclick=cancel;$("waitMore").onclick=()=>{$("waitNote").textContent="Continuiamo a cercare…";waitStarted=Date.now()};$("copy").onclick=async()=>{await navigator.clipboard.writeText($("shareLink").textContent);$("copy").textContent="Link copiato"};$("newChallenge").onclick=()=>{history.replaceState(null,"",location.pathname);duelId=null;state=null;viewKey="";show("setup")};
const p=new URLSearchParams(location.search),invite=p.get("invite"),resume=p.get("duel");if(invite){$("setupTitle").textContent="Hai ricevuto una sfida";$("setupText").textContent="Inserisci un nome e accetta per giocare.";$("setupActions").innerHTML='<button class="btn" id="acceptInvite">Accetta la sfida</button><a class="btn secondary" href="../sensore-adatto/" style="text-decoration:none">Gioca da solo</a>';$("acceptInvite").onclick=()=>join(invite)}else if(resume){duelId=resume;show("waiting");waitStarted=Date.now();beginPolling()}
setInterval(()=>{if(state&&state.phase!=="waiting"&&state.phase!=="finished")render()},250);
})();
</script></body></html>
